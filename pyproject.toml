[project]
name = "interns-dev"
version = "0.0.0"
description = "Repo-wide test, coverage and lint tooling (not a distributable package)"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-mock==3.15.1", "coverage==7.16.1", "ruff==0.15.0", "pip-audit==2.10.1"]

[tool.uv]
package = false

# One test configuration for all three packages. Tests import the packages
# from source, so no install step is needed and every suite runs from here.
[tool.pytest.ini_options]
testpaths = ["interns/tests", "installer/tests", "mcp/tests", "tests"]
pythonpath = [".", "tests", "interns/src", "installer/src", "mcp"]
# importlib: the suites share basenames (test_cli.py) and one has no __init__.py.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
# Directories, not packages, so modules a tier never imports still count as uncovered.
source = ["interns/src", "installer/src", "mcp"]
omit = ["*/tests/*"]
parallel = true
disable_warnings = ["module-not-imported", "no-data-collected"]
data_file = ".coverage/data"

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
# F: unused imports/variables, undefined names -- the cheap dead-code guard.
select = ["F"]
