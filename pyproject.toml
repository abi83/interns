[project]
name = "interns-dev"
version = "0.0.0"
description = "Repo-wide test, coverage and lint tooling (not a distributable package)"
requires-python = ">=3.12"
dependencies = ["mcp==2.2.0"]

[dependency-groups]
dev = ["pytest==8.3.5", "pytest-mock>=3.12", "coverage>=7.6", "ruff==0.15.0"]

[tool.uv]
package = false

# One test configuration for all three packages. Tests import the packages
# from source, so no install step is needed and every suite runs from here.
[tool.pytest.ini_options]
testpaths = ["pipeline/tests", "installer/tests", ".github/scripts/gh-issues-mcp/tests", "tests"]
pythonpath = [".", "pipeline/src", "installer/src", ".github/scripts/gh-issues-mcp"]
# importlib: the suites share basenames (test_cli.py) and one has no __init__.py.
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
# Directories, not packages, so modules a tier never imports still count as uncovered.
source = ["pipeline/src", "installer/src", ".github/scripts/gh-issues-mcp"]
omit = ["*/tests/*"]
parallel = true
# The tier runner itself imports nothing; only the entrypoint subprocesses are measured.
disable_warnings = ["module-not-imported", "no-data-collected"]
data_file = ".coverage/data"

[tool.coverage.report]
show_missing = true
skip_empty = true

# Floors for tools/test_unit.py and tools/test_integration.py: the measured
# branch coverage of each tier, minus a small margin. Raise them when
# coverage rises; a drop below fails the tier.
[tool.interns-tests.floors]
unit = 85
integration = 25

[tool.ruff]
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
# F: unused imports/variables, undefined names -- the cheap dead-code guard.
select = ["F"]
