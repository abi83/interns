name: resolve-agent-config
description: >
  Resolve the effective execution limits (and wiki setting) for one agent job
  via agent-config.sh: config file, else the built-in default. No other
  override layer.

inputs:
  agent:
    description: refiner | estimator | coder | reviewer
    required: true

outputs:
  model:
    value: ${{ steps.resolve.outputs.model }}
  max_turns:
    value: ${{ steps.resolve.outputs.max_turns }}
  timeout_minutes:
    value: ${{ steps.resolve.outputs.timeout_minutes }}
  max_output_tokens:
    value: ${{ steps.resolve.outputs.max_output_tokens }}
  cost_warn_usd:
    value: ${{ steps.resolve.outputs.cost_warn_usd }}
  wiki_enabled:
    value: ${{ steps.resolve.outputs.wiki_enabled }}
  wiki_repo:
    value: ${{ steps.resolve.outputs.wiki_repo }}

runs:
  using: composite
  steps:
    - name: Resolve agent config
      id: resolve
      shell: bash
      # github.action_path is this action's dir; composite `run:` steps
      # otherwise default their cwd to the caller's workspace root.
      run: ${{ github.action_path }}/../../scripts/pipeline/agent-config.sh ${{ inputs.agent }}
