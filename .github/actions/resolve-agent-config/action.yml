name: resolve-agent-config
description: >
  Resolve the effective execution limits (and wiki setting) for one agent job
  via interns.config: config file, else the built-in default. No other
  override layer.

inputs:
  agent:
    description: refiner | estimator | coder | reviewer
    required: true

outputs:
  model:
    value: ${{ steps.resolve.outputs.model }}
  max_turns:
    value: ${{ steps.resolve.outputs.max_turns }}
  timeout_minutes:
    value: ${{ steps.resolve.outputs.timeout_minutes }}
  max_output_tokens:
    value: ${{ steps.resolve.outputs.max_output_tokens }}
  cost_warn_usd:
    value: ${{ steps.resolve.outputs.cost_warn_usd }}
  tools_suffix:
    value: ${{ steps.resolve.outputs.tools_suffix }}
  allowed_tools_suffix:
    value: ${{ steps.resolve.outputs.allowed_tools_suffix }}
  wiki_enabled:
    value: ${{ steps.resolve.outputs.wiki_enabled }}
  wiki_repo:
    value: ${{ steps.resolve.outputs.wiki_repo }}
  wiki_dir:
    value: ${{ steps.resolve.outputs.wiki_dir }}
  debug:
    value: ${{ steps.resolve.outputs.debug }}
  disallowed_tools:
    value: ${{ steps.resolve.outputs.disallowed_tools }}

runs:
  using: composite
  steps:
    - name: Resolve agent config
      id: resolve
      shell: bash
      # env: rather than interpolating straight into `run:`, so a "`" or
      # "$(...)" in the value can't run as shell.
      env:
        AGENT: ${{ inputs.agent }}
      run: python3 -m interns.entrypoint config agent-config "$AGENT" >> "$GITHUB_OUTPUT"
