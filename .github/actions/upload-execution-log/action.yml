name: upload-execution-log
description: Upload a Claude agent's execution_file as a short-retention debug artifact

inputs:
  name:
    description: Artifact name (identify the agent/phase and issue/PR number)
    required: true
  path:
    description: Path to the execution_file to upload
    required: true

runs:
  using: composite
  steps:
    - name: Upload execution log
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
        if-no-files-found: ignore
        retention-days: 2
