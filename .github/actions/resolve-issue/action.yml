name: resolve-issue
description: Fetch an issue's number/title/body/labels/comments for a pipeline prompt

inputs:
  issue_number:
    required: true

outputs:
  number:
    value: ${{ steps.resolve.outputs.number }}
  title:
    value: ${{ steps.resolve.outputs.title }}
  body:
    value: ${{ steps.resolve.outputs.body }}
  labels:
    value: ${{ steps.resolve.outputs.labels }}
  comments:
    value: ${{ steps.resolve.outputs.comments }}

runs:
  using: composite
  steps:
    - name: Resolve issue
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        python3 -m interns.entrypoint fetch-issue --issue "${{ inputs.issue_number }}"
