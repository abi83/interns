name: resolve-issue
description: Fetch an issue's number/title/body/labels/comments for a pipeline prompt

inputs:
  issue_number:
    required: true

outputs:
  number:
    value: ${{ steps.resolve.outputs.number }}
  title:
    value: ${{ steps.resolve.outputs.title }}
  body:
    value: ${{ steps.resolve.outputs.body }}
  labels:
    value: ${{ steps.resolve.outputs.labels }}
  comments:
    value: ${{ steps.resolve.outputs.comments }}

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7

    - name: Resolve issue
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        uv run \
          --directory "${{ github.workspace }}/.interns/.github/scripts/gh-issues-mcp" \
          server.py --fetch "${{ inputs.issue_number }}"
