name: resolve-linked-issue
description: Resolve the issue number a PR closes, via GitHub's own closingIssuesReferences

inputs:
  pr_number:
    required: true

outputs:
  issue_number:
    value: ${{ steps.resolve.outputs.issue_number }}

runs:
  using: composite
  steps:
    - name: Resolve linked issue
      id: resolve
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ inputs.pr_number }}
      run: |
        NUM=$(python3 -m interns.entrypoint gh-query --query closing-issue --number "$PR")
        # A human-opened PR with no linked issue is expected, not an error: leave the output empty.
        echo "issue_number=$NUM" >> "$GITHUB_OUTPUT"
