name: gate-issue-type
description: Deterministic issue-type gate — park the issue and signal skip when its type:* label isn't accepted

inputs:
  issue_number:
    description: Issue number to gate
    required: true
  accepted_types:
    description: Comma-separated type:* labels the calling job can handle
    required: true
  remove_status:
    description: status:* label to remove when parking a rejected issue
    required: true
  reject_comment:
    description: Comment body posted on a rejected issue
    required: true

outputs:
  skip:
    description: "'true' when the issue's type isn't accepted and the caller must not run its agent"
    value: ${{ steps.gate.outputs.skip }}

runs:
  using: composite
  steps:
    - name: Gate
      id: gate
      shell: bash
      # Every input goes through env: rather than being interpolated straight
      # into `run:` -- GitHub substitutes ${{ }} into the YAML *before* bash
      # sees it, so a "`" or "$(...)" in an interpolated value would run as
      # shell with this step's GH_TOKEN. This is a reusable composite action,
      # so a future caller threading dynamic content (an issue title, say)
      # into reject_comment must stay safe by construction.
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        ACCEPTED_TYPES: ${{ inputs.accepted_types }}
        REMOVE_STATUS: ${{ inputs.remove_status }}
        REJECT_COMMENT: ${{ inputs.reject_comment }}
      run: >
        python3 -m interns.entrypoint gate-issue-type
        --issue "$ISSUE_NUMBER"
        --accepted "$ACCEPTED_TYPES"
        --remove-status "$REMOVE_STATUS"
        --reject-comment "$REJECT_COMMENT"
