name: Lint pipeline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint workflows and their inline run blocks
        # docker://rhysd/actionlint:1.7.12, pinned by digest.
        # -ignore '\.interns': the reusable workflows reference their own composite
        #   actions under ./.interns/... — a path that only exists at runtime, once
        #   the job self-checks-out this repo there (see code-pipeline.yml).
        # -ignore 'job_workflow_ref': actionlint doesn't know this context property
        #   yet; install.yml uses it intentionally (see its "Resolve pipeline ref").
        # -ignore 'create-github-app-token@v3': actionlint's bundled action metadata
        #   (checked against its own main branch) still only knows this action's
        #   deprecated `app-id` input -- upstream added `client-id` without
        #   actionlint's database catching up. We use `client-id` deliberately
        #   (`app-id` is deprecated by the action itself); this is a lint false
        #   positive, not a workflow bug.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color -ignore interns -ignore job_workflow_ref -ignore create-github-app-token@v3

      - name: Lint standalone shell scripts
        run: shellcheck install.sh

      - name: Validate the JSON schemas are well-formed
        run: >
          pipx run check-jsonschema --check-metaschema
          .github/interns.schema.json
          .github/pipeline-metrics.schema.json
          .github/labels.schema.json

      - name: Validate the label manifest against its schema
        run: >
          pipx run check-jsonschema --schemafile
          .github/labels.schema.json .github/labels.json

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Unused imports and dead code
        run: uv run --frozen ruff check .

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Unit tests, contract fixtures, guards — with coverage floor
        run: |
          uv run --frozen python -m coverage run -m pytest --ignore=tests/integration
          uv run --frozen python -m coverage combine
          uv run --frozen python -m coverage report

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Integration tests (real entrypoints, fake gh/git) — with coverage floor
        run: |
          uv run --frozen python -m coverage run -m pytest tests/integration
          uv run --frozen python -m coverage combine
          uv run --frozen python -m coverage report
