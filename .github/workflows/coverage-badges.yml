name: Coverage badges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coverage-badges
  cancel-in-progress: false

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6

      - name: Measure unit and integration coverage
        run: |
          mkdir "$RUNNER_TEMP/badges"
          measure() {
            local name=$1; shift
            uv run --frozen python -m coverage erase
            uv run --frozen python -m coverage run -m pytest "$@"
            uv run --frozen python -m coverage combine
            local total
            total=$(uv run --frozen python -m coverage report --format=total)
            local color=red
            if [ "$total" -ge 90 ]; then color=brightgreen
            elif [ "$total" -ge 80 ]; then color=green
            elif [ "$total" -ge 70 ]; then color=yellow
            elif [ "$total" -ge 60 ]; then color=orange
            fi
            printf '{"schemaVersion":1,"label":"%s coverage","message":"%s%%","color":"%s"}\n' \
              "$name" "$total" "$color" > "$RUNNER_TEMP/badges/$name.json"
          }
          measure unit interns/tests installer/tests gh_issues_mcp/tests
          measure integration tests/integration

      - name: Publish to the badges branch
        run: |
          dir="$RUNNER_TEMP/badges-branch"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch --depth 1 origin badges
            git worktree add "$dir" FETCH_HEAD
            git -C "$dir" checkout -B badges
          else
            git worktree add --detach "$dir"
            git -C "$dir" checkout --orphan badges
            git -C "$dir" rm -rfq .
          fi
          cp "$RUNNER_TEMP"/badges/*.json "$dir"/
          git -C "$dir" add -A
          if git -C "$dir" diff --cached --quiet; then
            echo "Badges unchanged."
            exit 0
          fi
          git -C "$dir" -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "chore: update coverage badges for $GITHUB_SHA"
          git -C "$dir" push origin badges
