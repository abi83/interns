name: Issue pipeline (reusable)

# Reusable core of the issue refine/estimate pipeline. Triggered only via
# issue-pipeline.yml, which owns the `issues` / `workflow_dispatch` triggers and
# passes its dispatch inputs through. External repos call this file the same way.
on:
  workflow_call:
    inputs:
      issue_number:
        description: Issue number (workflow_dispatch path only)
        required: false
        type: string
      phase:
        description: refine | estimate (workflow_dispatch path only)
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for anthropics/claude-code-action
        required: true

permissions:
  issues: write
  id-token: write

env:
  # Bash permission matching is a literal prefix match on the command string
  # (not a resolved path), so each gh-safe script needs an entry for every
  # form the agent might type it in: relative with ./, relative without it,
  # and workspace-absolute.
  ALLOWED_EDIT_BODY: "Bash(./.interns/.github/scripts/gh-safe/edit-issue-body.sh:*),Bash(.interns/.github/scripts/gh-safe/edit-issue-body.sh:*),Bash(${{ github.workspace }}/.interns/.github/scripts/gh-safe/edit-issue-body.sh:*)"
  ALLOWED_EDIT_TITLE: "Bash(./.interns/.github/scripts/gh-safe/edit-issue-title.sh:*),Bash(.interns/.github/scripts/gh-safe/edit-issue-title.sh:*),Bash(${{ github.workspace }}/.interns/.github/scripts/gh-safe/edit-issue-title.sh:*)"
  ALLOWED_EDIT_LABELS: "Bash(./.interns/.github/scripts/gh-safe/edit-issue-labels.sh:*),Bash(.interns/.github/scripts/gh-safe/edit-issue-labels.sh:*),Bash(${{ github.workspace }}/.interns/.github/scripts/gh-safe/edit-issue-labels.sh:*)"
  ALLOWED_COMMENT: "Bash(./.interns/.github/scripts/gh-safe/comment-issue.sh:*),Bash(.interns/.github/scripts/gh-safe/comment-issue.sh:*),Bash(${{ github.workspace }}/.interns/.github/scripts/gh-safe/comment-issue.sh:*)"

jobs:
  refine:
    if: >
      github.event.label.name == 'status:needs-refinement' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'refine')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pipeline ref
        id: pipeline_ref
        shell: bash
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: echo "ref=${JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: refiner

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          path: wiki

      - name: Resolve issue
        id: issue
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}

      - name: Resolve issue template
        id: template
        uses: ./.interns/.github/actions/resolve-issue-template

      - name: Preserve original body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          printf '<details><summary>Body before refinement</summary>\n\n%s\n\n</details>' "$ISSUE_BODY" \
            | gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body-file -

      - name: Run Claude refinement
        id: claude
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            TEMPLATE (section skeleton per issue type — after you pick the
            type, rewrite the body into the block whose `type:` header matches):
            ${{ steps.template.outputs.skeleton }}

            Read .interns/.github/prompts/refine.md for the exact rewrite
            rules and the mechanical steps, and apply them to the issue and
            comments above.

            Important: never pass issue body or comment text as a Bash
            command-line argument — multi-line markdown breaks shell
            quoting. Instead, use the Write tool to write text to a file
            first, then run the script with no arguments so it reads
            that file.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --allowedTools "Read,Grep,Glob,Write,${{ env.ALLOWED_EDIT_BODY }},${{ env.ALLOWED_EDIT_TITLE }},${{ env.ALLOWED_EDIT_LABELS }},${{ env.ALLOWED_COMMENT }}"

      - name: Report run cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          .interns/.github/scripts/pipeline/report-run.sh Refinement
          "${{ steps.claude.outputs.execution_file }}"
          "${{ steps.issue.outputs.number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.claude.outputs.execution_file != ''
        run: >
          .interns/.github/scripts/pipeline/extract-metrics.sh
          "${{ steps.claude.outputs.execution_file }}"
          --job refiner
          --issue "${{ steps.issue.outputs.number }}"
          > "${{ runner.temp }}/metrics-refiner.json"

      - name: Upload run metrics
        if: steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics-refiner
          path: ${{ runner.temp }}/metrics-refiner.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Apply refinement outcome
        if: success() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: >
          .interns/.github/scripts/pipeline/apply-outcome.sh refinement
          ./.issue-pipeline-outcome

      - name: Write run summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          .interns/.github/scripts/pipeline/run-summary.sh Refinement
          "${{ steps.claude.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          .interns/.github/scripts/pipeline/flag-failure.sh --noun refinement
          --issue "${{ steps.issue.outputs.number }}"

  estimate:
    if: >
      github.event.label.name == 'status:refined' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'estimate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pipeline ref
        id: pipeline_ref
        shell: bash
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: echo "ref=${JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: estimator

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          path: wiki

      - name: Resolve issue
        id: issue
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}

      # Deterministic backstop: the refiner can no longer produce a type:epic, so
      # on the happy path the estimator never sees one. This catches a manual
      # mislabel or a workflow_dispatch — a pure label transition, no agent.
      - name: Gate issue type
        id: gate
        uses: ./.interns/.github/actions/gate-issue-type
        with:
          issue_number: ${{ steps.issue.outputs.number }}
          accepted_types: type:coding-task,type:bug,type:spike
          remove_status: status:refined
          reject_comment: >-
            Epics aren't sized directly — a dev-effort number doesn't mean
            anything before the work is broken down. Break this into sub-issues
            and estimate those.

      - name: Run Claude estimation
        id: claude
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            Read .interns/.github/prompts/estimate.md for the exact sizing
            rules and the mechanical steps, and apply them to the refined
            issue and comments above.

            Important: never pass comment text as a Bash command-line
            argument — multi-line text breaks shell quoting. Instead, use
            the Write tool to write text to a file first, then run the
            script with no arguments so it reads that file.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --allowedTools "Read,Grep,Glob,Write,${{ env.ALLOWED_COMMENT }}"

      - name: Apply estimation outcome
        id: size
        if: steps.gate.outputs.skip != 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: >
          .interns/.github/scripts/pipeline/apply-outcome.sh estimation
          ./.issue-pipeline-outcome
          ./.issue-pipeline-comment.md

      - name: Spike advisory
        if: steps.gate.outputs.skip != 'true' && steps.size.outputs.outcome == 'estimated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE: ${{ steps.issue.outputs.number }}
        run: .interns/.github/scripts/pipeline/spike-advisory.sh

      - name: Report run cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          .interns/.github/scripts/pipeline/report-run.sh Estimation
          "${{ steps.claude.outputs.execution_file }}"
          "${{ steps.issue.outputs.number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.claude.outputs.execution_file != ''
        run: >
          .interns/.github/scripts/pipeline/extract-metrics.sh
          "${{ steps.claude.outputs.execution_file }}"
          --job estimator
          --issue "${{ steps.issue.outputs.number }}"
          > "${{ runner.temp }}/metrics-estimator.json"

      - name: Upload run metrics
        if: steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-metrics-estimator
          path: ${{ runner.temp }}/metrics-estimator.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Write run summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          .interns/.github/scripts/pipeline/run-summary.sh Estimation
          "${{ steps.claude.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          .interns/.github/scripts/pipeline/flag-failure.sh --noun estimation
          --issue "${{ steps.issue.outputs.number }}"

  metrics:
    # One commit per workflow run: append the records the agent jobs uploaded to
    # the metrics branch. The concurrency group serialises appends across runs.
    needs: [refine, estimate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-append
    steps:
      - name: Resolve pipeline ref
        id: pipeline_ref
        shell: bash
        env:
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: echo "ref=${JOB_WORKFLOW_REF##*@}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Download run metrics records
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: pipeline-metrics-*
          path: metrics-records
          merge-multiple: true

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics-records/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metrics records produced by this run — nothing to append."
            exit 0
          fi
          .interns/.github/scripts/pipeline/append-metrics.sh "${files[@]}"
