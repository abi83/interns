name: Issue pipeline (reusable)

# Reusable core of the issue refine/estimate pipeline. Triggered only via
# issue-pipeline.yml, which owns the `issues` / `workflow_dispatch` triggers and
# passes its dispatch inputs through. External repos call this file the same way.
on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Ref of abi83/interns to check out for pipeline assets (e.g. refs/tags/v0)
        required: true
        type: string
      issue_number:
        description: Issue number (workflow_dispatch path only)
        required: false
        type: string
      phase:
        description: refine | estimate (workflow_dispatch path only)
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for anthropics/claude-code-action
        required: true
      INTERNS_TRIAGE_APP_PRIVATE_KEY:
        description: Private key for the triage GitHub App (paired with vars.INTERNS_TRIAGE_CLIENT_ID)
        required: true

permissions:
  issues: write
  id-token: write

env:
  ALLOWED_LIST_ISSUES: "mcp__gh-issues__list_issues"
  ALLOWED_VIEW_ISSUE: "mcp__gh-issues__view_issue"
  ALLOWED_EDIT_LABELS: "mcp__gh-issues__edit_issue_labels"
  ALLOWED_EDIT_ISSUE: "mcp__gh-issues__edit_issue"
  ALLOWED_COMMENT: "mcp__gh-issues__comment_issue"
  ALLOWED_APPLY_REFINEMENT: "mcp__gh-issues__apply_refinement_outcome"
  ALLOWED_APPLY_ESTIMATION: "mcp__gh-issues__apply_estimation_outcome"

jobs:
  refine:
    if: >
      github.event.label.name == 'status:needs-refinement' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'refine')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pipeline ref
        id: pipeline_ref
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      # Resolved before the app-token step so Flag failure has a real issue
      # number even if that step fails (#90).
      - name: Resolve issue
        id: issue
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}

      # status:refined must be applied by a distinct App identity, not the
      # default GITHUB_TOKEN: GitHub never fires new workflow runs from
      # GITHUB_TOKEN-authored events (its anti-recursion rule), so a
      # GITHUB_TOKEN label write would silently never trigger the estimate
      # job (#89). Any App token escapes that restriction -- no self-approval
      # constraint here like coder/reviewer, so one shared App is enough.
      - name: Generate triage app token
        id: triage_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_TRIAGE_APP_PRIVATE_KEY }}

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: refiner

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          path: wiki

      - name: Resolve issue template
        id: template
        uses: ./.interns/.github/actions/resolve-issue-template

      - name: Preserve original body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: |
          printf '<details><summary>Body before refinement</summary>\n\n%s\n\n</details>' "$ISSUE_BODY" \
            | gh issue comment "$ISSUE_NUMBER" --repo ${{ github.repository }} --body-file -

      # Inlines the actual instructions instead of telling the agent to Read
      # them -- both files are already on disk from "Checkout pipeline
      # assets", so there is nothing to discover at runtime. Saves a
      # guaranteed tool call per file, every run (#98's investigation).
      - name: Load refiner instructions
        id: instructions
        run: python3 -m pipeline.prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/refine.md

      # Triage App token, not GITHUB_TOKEN: the apply_refinement_outcome tool
      # writes status:refined, which must trigger the estimate job. GitHub's
      # anti-recursion rule silences GITHUB_TOKEN-authored events.
      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.triage_token.outputs.token }}

      - name: Run Claude refinement
        id: claude
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            LABELS: ${{ steps.issue.outputs.labels }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            TEMPLATE (section skeleton per issue type — after you pick the
            type, rewrite the body into the block whose `type:` header matches):
            ${{ steps.template.outputs.skeleton }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the issue and comments above.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --allowedTools "Read,Grep,Glob,${{ env.ALLOWED_EDIT_ISSUE }},${{ env.ALLOWED_EDIT_LABELS }},${{ env.ALLOWED_COMMENT }},${{ env.ALLOWED_LIST_ISSUES }},${{ env.ALLOWED_VIEW_ISSUE }},${{ env.ALLOWED_APPLY_REFINEMENT }}"
            --disallowedTools "${{ steps.cfg.outputs.disallowed_tools }}"

      - name: Upload refiner execution log (debug)
        if: inputs.debug == 'true' && always() && steps.claude.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-refiner-issue-${{ steps.issue.outputs.number }}
          path: ${{ steps.claude.outputs.execution_file }}

      - name: Report run cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m pipeline.report_run Refinement
          "${{ steps.claude.outputs.execution_file }}"
          "${{ steps.issue.outputs.number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.claude.outputs.execution_file != ''
        run: >
          python3 -m pipeline.extract_metrics
          "${{ steps.claude.outputs.execution_file }}"
          --job refiner
          --issue "${{ steps.issue.outputs.number }}"
          > "${{ runner.temp }}/metrics-refiner.json"

      - name: Upload run metrics
        if: steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-refiner
          path: ${{ runner.temp }}/metrics-refiner.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Write run summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m pipeline.run_summary Refinement
          "${{ steps.claude.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m pipeline.flag_failure --noun refinement
          --issue "${{ steps.issue.outputs.number }}"

  estimate:
    if: >
      github.event.label.name == 'status:refined' ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'estimate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve pipeline ref
        id: pipeline_ref
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      # The status:refined label that triggers this job is written by the
      # triage App (see "Generate triage app token" in the refine job above),
      # so claude-code-action's non-human-actor check rejects the run unless
      # that App's login is in allowed_bots. Resolved here rather than
      # hardcoded -- same lesson as the reviewer's #103 fix.
      - name: Generate triage app token
        id: triage_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_TRIAGE_APP_PRIVATE_KEY }}

      - name: Resolve triage identity
        id: triage_ident
        run: echo "bot=${{ steps.triage_token.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: estimator

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          path: wiki

      - name: Resolve issue
        id: issue
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}

      # Deterministic backstop: the refiner can no longer produce a type:epic, so
      # on the happy path the estimator never sees one. This catches a manual
      # mislabel or a workflow_dispatch — a pure label transition, no agent.
      - name: Gate issue type
        id: gate
        uses: ./.interns/.github/actions/gate-issue-type
        with:
          issue_number: ${{ steps.issue.outputs.number }}
          accepted_types: type:coding-task,type:bug,type:spike
          remove_status: status:refined
          reject_comment: >-
            Epics aren't sized directly — a dev-effort number doesn't mean
            anything before the work is broken down. Break this into sub-issues
            and estimate those.

      - name: Load estimator instructions
        id: instructions
        if: steps.gate.outputs.skip != 'true'
        run: python3 -m pipeline.prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/estimate.md

      - name: Set up gh-issues MCP server
        if: steps.gate.outputs.skip != 'true'
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Claude estimation
        id: claude
        if: steps.gate.outputs.skip != 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: ${{ inputs.debug }}
          allowed_bots: "${{ steps.triage_ident.outputs.bot }}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            LABELS: ${{ steps.issue.outputs.labels }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the refined issue and comments above.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --allowedTools "Read,Grep,Glob,${{ env.ALLOWED_COMMENT }},${{ env.ALLOWED_APPLY_ESTIMATION }}"
            --disallowedTools "${{ steps.cfg.outputs.disallowed_tools }}"

      - name: Spike advisory
        if: steps.gate.outputs.skip != 'true' && steps.claude.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -m pipeline.spike_advisory "${{ steps.issue.outputs.number }}"

      - name: Upload estimator execution log (debug)
        if: steps.gate.outputs.skip != 'true' && inputs.debug == 'true' && always() && steps.claude.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-estimator-issue-${{ steps.issue.outputs.number }}
          path: ${{ steps.claude.outputs.execution_file }}

      - name: Report run cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m pipeline.report_run Estimation
          "${{ steps.claude.outputs.execution_file }}"
          "${{ steps.issue.outputs.number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.claude.outputs.execution_file != ''
        run: >
          python3 -m pipeline.extract_metrics
          "${{ steps.claude.outputs.execution_file }}"
          --job estimator
          --issue "${{ steps.issue.outputs.number }}"
          > "${{ runner.temp }}/metrics-estimator.json"

      - name: Upload run metrics
        if: steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-estimator
          path: ${{ runner.temp }}/metrics-estimator.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Write run summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m pipeline.run_summary Estimation
          "${{ steps.claude.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m pipeline.flag_failure --noun estimation
          --issue "${{ steps.issue.outputs.number }}"

  metrics:
    # One commit per workflow run: append the records the agent jobs uploaded to
    # the metrics branch. The concurrency group serialises appends across runs.
    needs: [refine, estimate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-append
    steps:
      - name: Resolve pipeline ref
        id: pipeline_ref
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Download run metrics records
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pipeline-metrics-*
          path: metrics-records
          merge-multiple: true

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics-records/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metrics records produced by this run — nothing to append."
            exit 0
          fi
          python3 -m pipeline.append_metrics "${files[@]}"
