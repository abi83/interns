name: Refine & estimate (reusable)

# Reusable core of the issue refine/estimate pipeline, called from the caller's issue-pipeline.yml.
# Dispatch inputs are declared only so older callers that pass them keep working.
on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Ref of abi83/interns to check out for pipeline assets (e.g. refs/tags/v0)
        required: true
        type: string
      issue_number:
        description: Issue number (workflow_dispatch path only)
        required: false
        type: string
      phase:
        description: refine | estimate (workflow_dispatch path only)
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for the Claude CLI
        required: true
      INTERNS_TRIAGE_APP_PRIVATE_KEY:
        description: Private key for the triage GitHub App (paired with vars.INTERNS_TRIAGE_CLIENT_ID)
        required: true

permissions:
  issues: write

env:
  ALLOWED_LIST_ISSUES: "mcp__gh-issues__list_issues"
  ALLOWED_VIEW_ISSUE: "mcp__gh-issues__view_issue"
  ALLOWED_SET_ISSUE_TYPE: "mcp__gh-issues__set_issue_type"
  ALLOWED_EDIT_ISSUE: "mcp__gh-issues__edit_issue"
  ALLOWED_COMMENT: "mcp__gh-issues__comment_issue"
  ALLOWED_APPLY_REFINEMENT: "mcp__gh-issues__apply_refinement_outcome"
  ALLOWED_APPLY_ESTIMATION: "mcp__gh-issues__apply_estimation_outcome"

jobs:
  plan:
    # Routing lives in Python (domain/routing.py, steps/confirm_route.py); this coarse filter
    # only avoids spending a runner on unrelated label events.
    if: >
      github.event_name != 'issues' ||
      github.event.label.name == 'status:needs-refinement' ||
      github.event.label.name == 'status:refined'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    outputs:
      job: ${{ steps.confirm.outputs.job }}
      issue: ${{ steps.confirm.outputs.issue }}
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Confirm route
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m interns.entrypoint confirm-route --handles refine,estimate

  refine:
    needs: plan
    if: needs.plan.outputs.job == 'refine'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      # Before the app-token step so Flag failure has an issue number if that step fails.
      - name: Resolve issue
        id: issue
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ needs.plan.outputs.issue }}

      # Distinct App identity: GITHUB_TOKEN-authored events never trigger new runs, so its
      # status:refined write would not start the estimate job.
      - name: Generate triage app token
        id: triage_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_TRIAGE_APP_PRIVATE_KEY }}

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: refiner

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: ./.interns/.github/actions/checkout-wiki
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          destination: ${{ steps.cfg.outputs.wiki_dir }}

      - name: Resolve issue template
        id: template
        uses: ./.interns/.github/actions/resolve-issue-template

      - name: Preserve original body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ steps.issue.outputs.body }}
        run: python3 -m interns.entrypoint preserve-issue-body --issue "${{ steps.issue.outputs.number }}"

      # Inlined so the agent needn't spend a tool call reading them.
      - name: Load refiner instructions
        id: instructions
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/refine.md

      # Triage App token: a GITHUB_TOKEN-authored status:refined would not trigger the estimate job.
      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.triage_token.outputs.token }}
          tools: list_issues,view_issue,set_issue_type,edit_issue,comment_issue,apply_refinement_outcome

      - name: Install Claude CLI
        uses: ./.interns/.github/actions/install-claude-cli

      - name: Run Claude refinement
        id: agent
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ steps.cfg.outputs.model }}
          AGENT_MAX_TURNS: ${{ steps.cfg.outputs.max_turns }}
          AGENT_TOOLS: Read,Grep,Glob${{ steps.cfg.outputs.tools_suffix }}
          AGENT_ALLOWED_TOOLS: Read,Grep,Glob,${{ env.ALLOWED_EDIT_ISSUE }},${{ env.ALLOWED_SET_ISSUE_TYPE }},${{ env.ALLOWED_COMMENT }},${{ env.ALLOWED_LIST_ISSUES }},${{ env.ALLOWED_VIEW_ISSUE }},${{ env.ALLOWED_APPLY_REFINEMENT }}${{ steps.cfg.outputs.allowed_tools_suffix }}
          AGENT_DISALLOWED_TOOLS: ${{ steps.cfg.outputs.disallowed_tools }}
          AGENT_ADD_DIR: ${{ steps.cfg.outputs.wiki_dir }}
          AGENT_DEBUG: ${{ (inputs.debug == true || steps.cfg.outputs.debug == 'true') && 'true' || 'false' }}
          INTERNS_AGENT_PROMPT: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            LABELS: ${{ steps.issue.outputs.labels }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            TEMPLATE (section skeleton per issue type — after you pick the
            type, rewrite the body into the block whose `type:` header matches):
            ${{ steps.template.outputs.skeleton }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the issue and comments above.
        run: >
          python3 -m interns.entrypoint run-agent
          --model "$AGENT_MODEL"
          --max-turns "$AGENT_MAX_TURNS"
          --mcp-config /tmp/mcp-config-gh-issues.json
          --tools "$AGENT_TOOLS"
          --allowed-tools "$AGENT_ALLOWED_TOOLS"
          --disallowed-tools "$AGENT_DISALLOWED_TOOLS"
          --add-dir "$AGENT_ADD_DIR"
          --execution-file "${{ runner.temp }}/execution-refiner.jsonl"
          --debug-file "${{ runner.temp }}/debug-refiner.log"
          --debug "$AGENT_DEBUG"

      - name: Upload refiner execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.agent.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-refiner-issue-${{ steps.issue.outputs.number }}
          path: |
            ${{ steps.agent.outputs.execution_file }}
            ${{ steps.agent.outputs.debug_file }}

      - name: Report run cost
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m interns.entrypoint report-run
          --phase Refinement
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint extract-metrics
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --job refiner
          --ref "${{ inputs.pipeline_ref }}"
          --issue "${{ steps.issue.outputs.number }}"
          > "${{ runner.temp }}/metrics-refiner.json"

      - name: Upload run metrics
        if: steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-refiner
          path: ${{ runner.temp }}/metrics-refiner.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Write run summary
        if: always() && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m interns.entrypoint run-summary
          --phase Refinement
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m interns.entrypoint flag-failure --noun refinement
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"

  estimate:
    needs: plan
    if: needs.plan.outputs.job == 'estimate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Generate triage app token
        id: triage_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_TRIAGE_APP_PRIVATE_KEY }}

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: estimator

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: ./.interns/.github/actions/checkout-wiki
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          destination: ${{ steps.cfg.outputs.wiki_dir }}

      - name: Resolve issue
        id: issue
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ needs.plan.outputs.issue }}

      - name: Load estimator instructions
        id: instructions
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/estimate.md

      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          tools: comment_issue,apply_estimation_outcome

      - name: Install Claude CLI
        uses: ./.interns/.github/actions/install-claude-cli

      - name: Run Claude estimation
        id: agent
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_MODEL: ${{ steps.cfg.outputs.model }}
          AGENT_MAX_TURNS: ${{ steps.cfg.outputs.max_turns }}
          AGENT_TOOLS: Read,Grep,Glob${{ steps.cfg.outputs.tools_suffix }}
          AGENT_ALLOWED_TOOLS: Read,Grep,Glob,${{ env.ALLOWED_COMMENT }},${{ env.ALLOWED_APPLY_ESTIMATION }}${{ steps.cfg.outputs.allowed_tools_suffix }}
          AGENT_DISALLOWED_TOOLS: ${{ steps.cfg.outputs.disallowed_tools }}
          AGENT_ADD_DIR: ${{ steps.cfg.outputs.wiki_dir }}
          AGENT_DEBUG: ${{ (inputs.debug == true || steps.cfg.outputs.debug == 'true') && 'true' || 'false' }}
          INTERNS_AGENT_PROMPT: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            LABELS: ${{ steps.issue.outputs.labels }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the refined issue and comments above.
        run: >
          python3 -m interns.entrypoint run-agent
          --model "$AGENT_MODEL"
          --max-turns "$AGENT_MAX_TURNS"
          --mcp-config /tmp/mcp-config-gh-issues.json
          --tools "$AGENT_TOOLS"
          --allowed-tools "$AGENT_ALLOWED_TOOLS"
          --disallowed-tools "$AGENT_DISALLOWED_TOOLS"
          --add-dir "$AGENT_ADD_DIR"
          --execution-file "${{ runner.temp }}/execution-estimator.jsonl"
          --debug-file "${{ runner.temp }}/debug-estimator.log"
          --debug "$AGENT_DEBUG"

      - name: Spike advisory
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m interns.entrypoint spike-advisory --issue "${{ steps.issue.outputs.number }}"

      - name: Verify estimation outcome applied
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          applied=$(gh issue view "${{ steps.issue.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --json labels \
            --jq '.labels | map(.name) | any(. == "status:estimated" or . == "status:needs-attention")')
          if [ "$applied" != "true" ]; then
            echo "::error::Estimator did not call apply_estimation_outcome — neither status:estimated nor status:needs-attention was set on issue #${{ steps.issue.outputs.number }}"
            exit 1
          fi

      # Triage token: a status:ready edit by GITHUB_TOKEN would not trigger the coder workflow.
      - name: Auto-proceed to coder
        if: steps.agent.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.triage_token.outputs.token }}
        run: python3 -m interns.entrypoint auto-proceed --issue "${{ steps.issue.outputs.number }}"

      - name: Upload estimator execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.agent.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-estimator-issue-${{ steps.issue.outputs.number }}
          path: |
            ${{ steps.agent.outputs.execution_file }}
            ${{ steps.agent.outputs.debug_file }}

      - name: Report run cost
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m interns.entrypoint report-run
          --phase Estimation
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint extract-metrics
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --job estimator
          --ref "${{ inputs.pipeline_ref }}"
          --issue "${{ steps.issue.outputs.number }}"
          > "${{ runner.temp }}/metrics-estimator.json"

      - name: Upload run metrics
        if: steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-estimator
          path: ${{ runner.temp }}/metrics-estimator.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Write run summary
        if: always() && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m interns.entrypoint run-summary
          --phase Estimation
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          python3 -m interns.entrypoint flag-failure --noun estimation
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"

  metrics:
    needs: [plan, refine, estimate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-append
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Download run metrics records
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pipeline-metrics-*
          path: metrics-records
          merge-multiple: true

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics-records/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metrics records produced by this run — nothing to append."
            exit 0
          fi
          python3 -m interns.entrypoint append-metrics "${files[@]}"
