name: Code & review (reusable)

# Reusable core of the coder/reviewer pipeline. Triggered only via
# code-pipeline.yml, which owns the `issues` / `pull_request` /
# `workflow_dispatch` triggers. The plan job routes the triggering event itself
# (from its payload); the dispatch inputs below are only still declared so an
# older caller that passes them keeps working.
on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Ref of abi83/interns to check out for pipeline assets (e.g. refs/tags/v0)
        required: true
        type: string
      issue_number:
        description: Issue number (coder phase, workflow_dispatch only)
        required: false
        type: string
      pr_number:
        description: PR number (reviewer phase, workflow_dispatch only)
        required: false
        type: string
      fix_round:
        description: Treat a coder dispatch as a reviewer fix round
        required: false
        type: boolean
        default: false
      phase:
        description: coder | reviewer (workflow_dispatch only)
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for anthropics/claude-code-action
        required: true
      INTERNS_REVIEWER_APP_PRIVATE_KEY:
        description: Private key for the reviewer GitHub App (paired with vars.INTERNS_REVIEWER_CLIENT_ID); reviewer job only
        required: true
      INTERNS_CODER_APP_PRIVATE_KEY:
        description: Private key for the coder GitHub App (paired with vars.INTERNS_CODER_CLIENT_ID); coder job only
        required: true
      INTERNS_TRIAGE_APP_PRIVATE_KEY:
        description: Private key for the triage GitHub App (paired with vars.INTERNS_TRIAGE_CLIENT_ID); coder job only, to allowlist it as a trigger actor
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  ALLOWED_COMMENT_ISSUE: "mcp__gh-issues__comment_issue"
  ALLOWED_COMMENT_PR: "mcp__gh-issues__comment_pr"
  ALLOWED_OPEN_PR: "mcp__gh-issues__open_pr"
  ALLOWED_SUBMIT_REVIEW: "mcp__gh-issues__submit_pr_review"
  ALLOWED_PUSH_BRANCH: "mcp__gh-issues__push_branch"
  ALLOWED_VIEW_ISSUE: "mcp__gh-issues__view_issue"
  # In-sandbox git only. git push is deliberately absent — reaching the shared remote goes through mcp__gh-issues__push_branch.
  # Branch checkout is a workflow step now (Create coder branch / Checkout PR
  # branch below), not something the coder does itself, so checkout/switch
  # aren't in this list.
  ALLOWED_GIT_WRITE: "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git mv:*)"
  ALLOWED_GIT_READ: "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
  # Read-only filesystem inspection for the coder; Write/Edit stay the only
  # write path. No sed: no uniqueness check like Edit, easy to over-match.
  ALLOWED_FS_READ: "Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(wc:*)"
  # `make` targets, not a package-manager-specific command, so this stays the
  # same regardless of the consumer repo's language. See templates/config/Makefile.
  ALLOWED_BUILD_TEST: "Bash(make test:*),Bash(make build:*)"
  ALLOWED_CI_READ: "Bash(gh pr checks:*),Bash(gh run view:*)"
  # The reviewer's sanctioned diff source. `gh pr diff` returns the API diff,
  # which includes paths (e.g. .github/workflows/**) that claude-code-action
  # relocates out of the working tree, so `git diff` alone can't see them (#13).
  ALLOWED_PR_READ: "Bash(gh pr diff:*),Bash(gh pr view:*)"

jobs:
  plan:
    # Every trigger-to-job and skip/run decision is made here, in Python
    # (domain/routing.py plus the gates in steps/confirm_route.py); the jobs
    # below gate only on `needs.plan.outputs.job`. This coarse filter keeps
    # unrelated label events from spending a runner.
    if: github.event_name != 'issues' || github.event.label.name == 'status:ready'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      job: ${{ steps.confirm.outputs.job }}
      issue: ${{ steps.confirm.outputs.issue }}
      pr: ${{ steps.confirm.outputs.pr }}
      fix_round: ${{ steps.confirm.outputs.fix_round }}
      reviewer_bot: ${{ steps.reviewer_token.outputs.app-slug }}[bot]
      coder_bot: ${{ steps.coder_token.outputs.app-slug }}[bot]
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Route event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m interns.entrypoint route-event --handles coder,reviewer,pr_closed

      # Reviewer-only below: the consumer's .github/interns.yml for the review
      # gate (a subdirectory, so the .interns checkout survives), and both App
      # logins -- the reviewer's to find its own reviews, the coder's to tell a
      # pipeline PR from another bot's. Forks have no secrets to mint them with.
      - name: Checkout consumer repo
        if: steps.route.outputs.job == 'reviewer'
        uses: actions/checkout@v5
        with:
          path: consumer

      - name: Generate reviewer app token
        id: reviewer_token
        if: steps.route.outputs.job == 'reviewer'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_REVIEWER_APP_PRIVATE_KEY }}

      - name: Generate coder app token
        id: coder_token
        if: steps.route.outputs.job == 'reviewer'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_CODER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_CODER_APP_PRIVATE_KEY }}

      - name: Confirm route
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
          INTERNS_CONFIG: consumer/.github/interns.yml
          REVIEWER_BOT: ${{ steps.reviewer_token.outputs.app-slug }}[bot]
          CODER_BOT: ${{ steps.coder_token.outputs.app-slug }}[bot]
        run: python3 -m interns.entrypoint confirm-route --handles coder,reviewer,pr_closed

  coder:
    needs: plan
    if: needs.plan.outputs.job == 'coder'
    runs-on: ubuntu-latest
    concurrency:
      group: coder-issue-${{ needs.plan.outputs.issue }}
    steps:
      # The coder pushes branches and opens PRs under its own GitHub App
      # identity (interns-coder: pull_requests/issues write, contents write), so
      # authorship, audit trail, and branch-protection rules can treat it
      # separately from the reviewer's identity and from github-actions[bot].
      # The installer's safety check requires vars.INTERNS_CODER_CLIENT_ID +
      # secrets.INTERNS_CODER_APP_PRIVATE_KEY, so this is unconditional like the
      # reviewer's equivalent.
      - name: Generate coder app token
        id: coder_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_CODER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_CODER_APP_PRIVATE_KEY }}

      # auto_proceed applies `status:ready` as the triage App; allowed_bots needs its login.
      - name: Generate triage app token
        id: triage_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_TRIAGE_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_TRIAGE_APP_PRIVATE_KEY }}

      - name: Resolve triage identity
        id: triage_ident
        run: echo "bot=${{ steps.triage_token.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Persisted so the agent's push_branch MCP tool reaches origin as the coder App.
          token: ${{ steps.coder_token.outputs.token }}

      # After the main checkout (it wipes the workspace) and `if: always()`, so
      # Flag failure still has .interns/ when an earlier step fails (#90).
      - name: Checkout pipeline assets
        if: always()
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        if: always()
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Resolve issue
        id: issue
        if: always()
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ needs.plan.outputs.issue }}

      - name: Set in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # set-issue-status also clears status:needs-attention so a human
          # re-dispatch after a failed run (initial or fix round) leaves no
          # contradictory labels.
          python3 -m interns.entrypoint labels set-issue-status "${{ steps.issue.outputs.number }}" status:in-progress

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: coder

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: ./.interns/.github/actions/checkout-wiki
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          destination: ${{ steps.cfg.outputs.wiki_dir }}

      - name: Resolve existing PR (fix round)
        id: pr
        if: needs.plan.outputs.fix_round == 'true'
        uses: ./.interns/.github/actions/find-pr-for-issue
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - name: Mark PR pr:coding (fix round)
        if: needs.plan.outputs.fix_round == 'true' && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m interns.entrypoint labels set-pr-label "${{ steps.pr.outputs.pr_number }}" pr:coding

      - name: Gather reviewer feedback (fix round)
        id: feedback
        if: needs.plan.outputs.fix_round == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: >
          python3 -m interns.entrypoint gather-fix-feedback
          --pr "${{ steps.pr.outputs.pr_number }}"
          --head-ref "$HEAD_REF"
          --issue "${{ steps.issue.outputs.number }}"

      # Both the Conventional Commit prefix and the branch name are derivable
      # from the issue's type:* label and title before the agent runs — the
      # coder shouldn't spend reasoning inventing them. Initial round only; a
      # fix round reuses the existing PR branch.
      - name: Derive commit-type and branch hints
        id: hints
        if: needs.plan.outputs.fix_round != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          python3 -m interns.entrypoint derive-code-hints
          --issue "${{ steps.issue.outputs.number }}"

      # Creating the branch is as mechanical as naming it -- do it here rather
      # than have the coder spend a tool call discovering it's still on the
      # checked-out default branch and switching itself.
      - name: Create coder branch
        if: needs.plan.outputs.fix_round != 'true'
        env:
          BRANCH: ${{ steps.hints.outputs.branch }}
        run: |
          # A failed earlier run may have saved its work as a draft PR on this
          # branch: resume from it instead of starting over (and colliding on push).
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Load coder instructions
        id: instructions
        if: needs.plan.outputs.fix_round != 'true'
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/_shared-coder.md .interns/.github/prompts/code.md

      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.coder_token.outputs.token }}
          tools: push_branch,open_pr,comment_issue,comment_pr

      # Consumer-owned `make setup`, like test/build: the coder runs in a fresh
      # runner and its allowlist can't install anything. A failure here fails
      # the job before any Claude tokens are spent.
      - name: Install dependencies (make setup)
        run: python3 -m interns.entrypoint run-setup "$GITHUB_WORKSPACE"

      - name: Run Claude coder (initial implementation)
        id: claude_initial
        if: needs.plan.outputs.fix_round != 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.coder_token.outputs.token }}
          show_full_output: ${{ inputs.debug == true || steps.cfg.outputs.debug == 'true' }}
          allowed_bots: "claude[bot],${{ steps.triage_ident.outputs.bot }}"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            COMMIT_TYPE_HINT: ${{ steps.hints.outputs.commit_type_hint }}
            BRANCH: ${{ steps.hints.outputs.branch }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the issue above.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --tools "Read,Grep,Glob,Write,Edit,Bash${{ steps.cfg.outputs.tools_suffix }}"
            --allowedTools "Read,Grep,Glob,Write,Edit,${{ env.ALLOWED_FS_READ }},${{ env.ALLOWED_GIT_WRITE }},${{ env.ALLOWED_BUILD_TEST }},${{ env.ALLOWED_PUSH_BRANCH }},${{ env.ALLOWED_OPEN_PR }},${{ env.ALLOWED_COMMENT_ISSUE }}${{ steps.cfg.outputs.allowed_tools_suffix }}"
            ${{ steps.cfg.outputs.add_dir_arg }}
            ${{ steps.cfg.outputs.disallowed_tools_arg }}

      - name: Upload coder-initial execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.claude_initial.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-coder-initial-issue-${{ steps.issue.outputs.number }}
          path: ${{ steps.claude_initial.outputs.execution_file }}

      # The agent can run out of turns before it ever commits or pushes; keep
      # its working tree as a draft PR instead of losing it with the runner.
      - name: Save unfinished work as draft PR
        id: draft_pr
        if: failure() && steps.claude_initial.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.coder_token.outputs.token }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          COMMIT_TYPE_HINT: ${{ steps.hints.outputs.commit_type_hint }}
          GIT_AUTHOR_NAME: interns-coder
          GIT_AUTHOR_EMAIL: interns-coder@users.noreply.github.com
          GIT_COMMITTER_NAME: interns-coder
          GIT_COMMITTER_EMAIL: interns-coder@users.noreply.github.com
        run: >
          python3 -m interns.entrypoint save-draft-pr
          --issue "${{ steps.issue.outputs.number }}"
          --issue-title "$ISSUE_TITLE"
          --commit-type-hint "$COMMIT_TYPE_HINT"

      - name: Load coder fix-round instructions
        id: fix_instructions
        if: needs.plan.outputs.fix_round == 'true'
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/_shared-coder.md .interns/.github/prompts/code-fix.md

      - name: Run Claude coder (fix round)
        id: claude_fix
        if: needs.plan.outputs.fix_round == 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.coder_token.outputs.token }}
          show_full_output: ${{ inputs.debug == true || steps.cfg.outputs.debug == 'true' }}
          # The fix round is dispatched by the reviewer job via `gh workflow run`
          # with the default token, so the triggering actor is github-actions[bot],
          # not a human label event — claude-code-action refuses it unless the bot
          # is allowlisted here.
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            PR NUMBER: ${{ steps.pr.outputs.pr_number }}
            BRANCH: ${{ steps.pr.outputs.head_ref }} (already checked out)

            REVIEWER FEEDBACK:
            ${{ steps.feedback.outputs.text }}

            INSTRUCTIONS:
            ${{ steps.fix_instructions.outputs.text }}

            Apply the instructions above to the feedback above.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --tools "Read,Grep,Glob,Write,Edit,Bash${{ steps.cfg.outputs.tools_suffix }}"
            --allowedTools "Read,Grep,Glob,Write,Edit,${{ env.ALLOWED_FS_READ }},${{ env.ALLOWED_GIT_WRITE }},${{ env.ALLOWED_BUILD_TEST }},${{ env.ALLOWED_PUSH_BRANCH }},${{ env.ALLOWED_COMMENT_PR }}${{ steps.cfg.outputs.allowed_tools_suffix }}"
            ${{ steps.cfg.outputs.add_dir_arg }}
            ${{ steps.cfg.outputs.disallowed_tools_arg }}

      - name: Upload coder-fix execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.claude_fix.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-coder-fix-issue-${{ steps.issue.outputs.number }}
          path: ${{ steps.claude_fix.outputs.execution_file }}

      # Deterministic, independent of what the coder did or said this run --
      # greps the Makefile on disk rather than trusting the agent's word for
      # it, so the nudge below fires even on a run that failed outright.
      - name: Check test/build configuration
        id: build_config
        if: always()
        run: python3 -m interns.entrypoint check-build-config "$GITHUB_WORKSPACE"

      - name: Report run cost
        if: always() && (steps.claude_initial.outputs.execution_file != '' || steps.claude_fix.outputs.execution_file != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          warn_args=()
          if [[ "${{ steps.build_config.outputs.configured }}" != "true" ]]; then
            warn_args=(--warn "tests/build aren't configured for this repo — fill in the test/build targets in Makefile so the pipeline can actually verify changes.")
          fi
          python3 -m interns.entrypoint report-run \
            --phase Coder \
            --exec-file "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}" \
            --issue "${{ steps.issue.outputs.number }}" \
            "${warn_args[@]}"

      # A fix round that can't do the work (protected path, out-of-scope or
      # contradictory feedback, needs an owner decision) leaves a
      # ./.coder-gave-up.md sentinel instead of pushing. Escalate straight to a
      # human rather than handing the PR back to the reviewer for a wasted
      # round (#9). Exit 0 is kept — the agent isn't failing, it's reporting it
      # can't proceed — so this is distinct from `Flag failure`.
      - name: Check for coder give-up (fix round)
        id: giveup
        if: needs.plan.outputs.fix_round == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint handle-giveup
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.pr.outputs.pr_number }}"

      - name: Check PR now exists
        id: verify_pr
        if: success() && steps.giveup.outputs.gave_up != 'true'
        uses: ./.interns/.github/actions/find-pr-for-issue
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && (steps.claude_initial.outputs.execution_file != '' || steps.claude_fix.outputs.execution_file != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint extract-metrics
          --exec-file "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}"
          --job coder
          --ref "${{ inputs.pipeline_ref }}"
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number || steps.pr.outputs.pr_number }}"
          > "${{ runner.temp }}/metrics-coder.json"

      - name: Upload run metrics
        if: always() && steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-coder
          path: ${{ runner.temp }}/metrics-coder.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Hand off to reviewer
        if: success() && steps.giveup.outputs.gave_up != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint handoff-to-review
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number }}"

      - name: Write run summary
        if: always() && (steps.claude_initial.outcome != 'skipped' || steps.claude_fix.outcome != 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint run-summary
          --phase Coder
          --exec-file "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number || steps.pr.outputs.pr_number }}"
          --round ${{ needs.plan.outputs.fix_round == 'true' && 'fix' || 'initial' }}
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_ROUND: ${{ needs.plan.outputs.fix_round }}
        run: |
          if [[ "$FIX_ROUND" == "true" ]]; then
            python3 -m interns.entrypoint flag-failure --noun implementation \
              --exec-file "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}" \
              --issue "${{ steps.issue.outputs.number }}" \
              --pr "${{ steps.pr.outputs.pr_number }}" --fix-round
          else
            python3 -m interns.entrypoint flag-failure --noun implementation \
              --exec-file "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}" \
              --issue "${{ steps.issue.outputs.number }}" \
              --draft-pr-url "${{ steps.draft_pr.outputs.draft_pr_url }}"
          fi

  reviewer:
    needs: plan
    if: needs.plan.outputs.job == 'reviewer'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN-authored label edits don't fire new workflow runs (GitHub's
    # anti-recursion rule for the default token), so a label alone would never
    # re-trigger the coder job for a fix round. actions: write lets this job
    # explicitly dispatch it instead (see "Apply verdict" below) — an
    # intentional workflow_dispatch call, which is exempt from that restriction.
    # Overriding permissions at job level means every permission this job needs
    # must be listed here, not just the new one.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    concurrency:
      group: reviewer-pr-${{ needs.plan.outputs.pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      # A `pull_request` event checks out GitHub's synthetic merge-preview
      # ref by default, and a `workflow_dispatch` re-run (no --ref) leaves us
      # on the default branch instead — neither is the PR's actual head. The
      # coder job hits the same gap for its fix round (see "Checkout PR
      # branch (fix round)" above) and fixes it the same way.
      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ needs.plan.outputs.pr }}"
          HEAD_REF=$(python3 -m interns.entrypoint gh-query --query head-ref --number "$PR")
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Resolve linked issue
        id: linked
        uses: ./.interns/.github/actions/resolve-linked-issue
        with:
          pr_number: ${{ needs.plan.outputs.pr }}

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: reviewer

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: ./.interns/.github/actions/checkout-wiki
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          destination: ${{ steps.cfg.outputs.wiki_dir }}

      - name: Generate reviewer app token
        id: reviewer_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_REVIEWER_APP_PRIVATE_KEY }}

      - name: Load reviewer instructions
        id: instructions
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/review.md

      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.reviewer_token.outputs.token }}
          tools: view_issue,submit_pr_review,comment_pr

      - name: Run Claude reviewer
        id: claude
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.reviewer_token.outputs.token }}
          show_full_output: ${{ inputs.debug == true || steps.cfg.outputs.debug == 'true' }}
          allowed_bots: "${{ needs.plan.outputs.coder_bot }}"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.plan.outputs.pr }}
            LINKED ISSUE: ${{ steps.linked.outputs.issue_number }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Review this PR's diff against the linked issue's Acceptance Criteria.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --tools "Read,Grep,Glob,Bash${{ steps.cfg.outputs.tools_suffix }}"
            --allowedTools "Read,Grep,Glob,${{ env.ALLOWED_GIT_READ }},${{ env.ALLOWED_PR_READ }},${{ env.ALLOWED_CI_READ }},${{ env.ALLOWED_VIEW_ISSUE }},${{ env.ALLOWED_SUBMIT_REVIEW }},${{ env.ALLOWED_COMMENT_PR }}${{ steps.cfg.outputs.allowed_tools_suffix }}"
            ${{ steps.cfg.outputs.add_dir_arg }}
            ${{ steps.cfg.outputs.disallowed_tools_arg }}

      - name: Upload reviewer execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.claude.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-reviewer-pr-${{ needs.plan.outputs.pr }}
          path: ${{ steps.claude.outputs.execution_file }}

      - name: Report run cost
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint report-run
          --phase Review
          --exec-file "${{ steps.claude.outputs.execution_file }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --pr "${{ needs.plan.outputs.pr }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint extract-metrics
          --exec-file "${{ steps.claude.outputs.execution_file }}"
          --job reviewer
          --ref "${{ inputs.pipeline_ref }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --pr "${{ needs.plan.outputs.pr }}"
          > "${{ runner.temp }}/metrics-reviewer.json"

      - name: Upload run metrics
        if: always() && steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-reviewer
          path: ${{ runner.temp }}/metrics-reviewer.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Apply reviewer verdict
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ needs.plan.outputs.reviewer_bot }}
        run: >
          python3 -m interns.entrypoint apply-verdict
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"

      - name: Write run summary
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ needs.plan.outputs.reviewer_bot }}
        run: >
          python3 -m interns.entrypoint run-summary
          --phase Review
          --exec-file "${{ steps.claude.outputs.execution_file }}"
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint flag-failure --noun review
          --exec-file "${{ steps.claude.outputs.execution_file }}"
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"

  pr_closed:
    # Nothing else in the pipeline reacts to a PR closing, so the linked issue
    # would keep status:in-progress forever (#37). On merge, drop the label from
    # the already-closed issue; on an unmerged close, move it to
    # status:needs-attention with a comment. Clears any stale pr:* label either
    # way. No agent, no secrets — just label bookkeeping.
    needs: plan
    if: needs.plan.outputs.job == 'pr_closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pr-closed-${{ needs.plan.outputs.pr }}
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Resolve linked issue
        id: linked
        uses: ./.interns/.github/actions/resolve-linked-issue
        with:
          pr_number: ${{ needs.plan.outputs.pr }}

      - name: Handle PR closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint handle-pr-closed
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --merged "${{ github.event.pull_request.merged }}"

  metrics:
    # One commit per workflow run: append the records the agent jobs uploaded to
    # the metrics branch. The concurrency group serialises appends across runs.
    needs: [plan, coder, reviewer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-append
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Download run metrics records
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pipeline-metrics-*
          path: metrics-records
          merge-multiple: true

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics-records/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metrics records produced by this run — nothing to append."
            exit 0
          fi
          python3 -m interns.entrypoint append-metrics "${files[@]}"
