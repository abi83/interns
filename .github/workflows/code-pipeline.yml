name: Code & review (reusable)

# Reusable core of the coder/reviewer pipeline, called from the caller's code-pipeline.yml.
# Dispatch inputs are declared only so older callers that pass them keep working.
on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Ref of abi83/interns to check out for pipeline assets (e.g. refs/tags/v0)
        required: true
        type: string
      issue_number:
        description: Issue number (coder phase, workflow_dispatch only)
        required: false
        type: string
      pr_number:
        description: PR number (reviewer phase, workflow_dispatch only)
        required: false
        type: string
      fix_round:
        description: Treat a coder dispatch as a reviewer fix round
        required: false
        type: boolean
        default: false
      phase:
        description: coder | reviewer (workflow_dispatch only)
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for the Claude CLI
        required: true
      INTERNS_REVIEWER_APP_PRIVATE_KEY:
        description: Private key for the reviewer GitHub App (paired with vars.INTERNS_REVIEWER_CLIENT_ID); reviewer job only
        required: true
      INTERNS_CODER_APP_PRIVATE_KEY:
        description: Private key for the coder GitHub App (paired with vars.INTERNS_CODER_CLIENT_ID); coder job only
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  ALLOWED_COMMENT_ISSUE: "mcp__gh-issues__comment_issue"
  ALLOWED_COMMENT_PR: "mcp__gh-issues__comment_pr"
  ALLOWED_OPEN_PR: "mcp__gh-issues__open_pr"
  ALLOWED_SUBMIT_REVIEW: "mcp__gh-issues__submit_pr_review"
  ALLOWED_PUSH_BRANCH: "mcp__gh-issues__push_branch"
  ALLOWED_VIEW_ISSUE: "mcp__gh-issues__view_issue"
  ALLOWED_VIEW_PR: "mcp__gh-issues__view_pr"
  ALLOWED_VIEW_PR_DIFF: "mcp__gh-issues__view_pr_diff"
  ALLOWED_PR_CHECKS: "mcp__gh-issues__pr_checks"
  ALLOWED_VIEW_JOB_LOG: "mcp__gh-issues__view_job_log"
  # git push is deliberately absent: the remote is reached via mcp__gh-issues__push_branch.
  ALLOWED_GIT_WRITE: "Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(git mv:*)"
  ALLOWED_GIT_READ: "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
  # Write/Edit stay the only write path; no sed (no uniqueness check, easy to over-match).
  ALLOWED_FS_READ: "Bash(ls:*),Bash(cat:*),Bash(head:*),Bash(wc:*)"
  # make targets keep this independent of the consumer repo's language.
  ALLOWED_BUILD_TEST: "Bash(make test:*),Bash(make build:*)"

jobs:
  plan:
    # Routing lives in Python (domain/routing.py, steps/confirm_route.py); this coarse filter
    # only avoids spending a runner on unrelated events.
    if: >
      (github.event_name != 'issues' || github.event.label.name == 'status:ready') &&
      (github.event_name != 'workflow_run' ||
        (github.event.workflow_run.pull_requests[0].number && github.event.workflow_run.workflow_id != github.event.workflow.id))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      job: ${{ steps.confirm.outputs.job }}
      issue: ${{ steps.confirm.outputs.issue }}
      pr: ${{ steps.confirm.outputs.pr }}
      fix_round: ${{ steps.confirm.outputs.fix_round }}
      reviewer_bot: ${{ steps.reviewer_token.outputs.app-slug }}[bot]
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Route event
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m interns.entrypoint route-event --handles coder,reviewer,pr_closed

      # Reviewer-only: interns.yml sits in a subdirectory so the .interns checkout survives;
      # forks have no secrets to mint the App logins with.
      - name: Checkout consumer repo
        if: steps.route.outputs.job == 'reviewer'
        uses: actions/checkout@v5
        with:
          path: consumer

      - name: Generate reviewer app token
        id: reviewer_token
        if: steps.route.outputs.job == 'reviewer'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_REVIEWER_APP_PRIVATE_KEY }}

      - name: Generate coder app token
        id: coder_token
        if: steps.route.outputs.job == 'reviewer'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_CODER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_CODER_APP_PRIVATE_KEY }}

      - name: Confirm route
        id: confirm
        env:
          GH_TOKEN: ${{ github.token }}
          INTERNS_CONFIG: consumer/.github/interns.yml
          REVIEWER_BOT: ${{ steps.reviewer_token.outputs.app-slug }}[bot]
          CODER_BOT: ${{ steps.coder_token.outputs.app-slug }}[bot]
        run: python3 -m interns.entrypoint confirm-route --handles coder,reviewer,pr_closed

  coder:
    needs: plan
    if: needs.plan.outputs.job == 'coder'
    runs-on: ubuntu-latest
    concurrency:
      group: coder-issue-${{ needs.plan.outputs.issue }}
    steps:
      # Own App identity so authorship and branch protection can tell the coder apart from the
      # reviewer and github-actions[bot].
      - name: Generate coder app token
        id: coder_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_CODER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_CODER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Persisted so the agent's push_branch MCP tool reaches origin as the coder App.
          token: ${{ steps.coder_token.outputs.token }}

      # After the main checkout (it wipes the workspace) and always(): Flag failure still needs .interns/.
      - name: Checkout pipeline assets
        if: always()
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        if: always()
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Resolve issue
        id: issue
        if: always()
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ needs.plan.outputs.issue }}

      - name: Set in-progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m interns.entrypoint labels set-issue-status "${{ steps.issue.outputs.number }}" status:in-progress

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: coder

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: ./.interns/.github/actions/checkout-wiki
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          destination: ${{ steps.cfg.outputs.wiki_dir }}

      - name: Resolve existing PR (fix round)
        id: pr
        if: needs.plan.outputs.fix_round == 'true'
        uses: ./.interns/.github/actions/find-pr-for-issue
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - name: Mark PR pr:coding (fix round)
        if: needs.plan.outputs.fix_round == 'true' && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m interns.entrypoint labels set-pr-label "${{ steps.pr.outputs.pr_number }}" pr:coding

      - name: Gather reviewer feedback (fix round)
        id: feedback
        if: needs.plan.outputs.fix_round == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        run: >
          python3 -m interns.entrypoint gather-fix-feedback
          --pr "${{ steps.pr.outputs.pr_number }}"
          --head-ref "$HEAD_REF"
          --issue "${{ steps.issue.outputs.number }}"

      - name: Derive commit-type and branch hints
        id: hints
        if: needs.plan.outputs.fix_round != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          python3 -m interns.entrypoint derive-code-hints
          --issue "${{ steps.issue.outputs.number }}"

      - name: Create coder branch
        if: needs.plan.outputs.fix_round != 'true'
        env:
          BRANCH: ${{ steps.hints.outputs.branch }}
        run: |
          # A failed earlier run may have left a draft PR on this branch: resume from it, avoiding a push collision.
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Load coder instructions
        id: instructions
        if: needs.plan.outputs.fix_round != 'true'
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/_shared-coder.md .interns/.github/prompts/code.md

      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.coder_token.outputs.token }}
          tools: push_branch,open_pr,comment_issue,comment_pr

      - name: Install Claude CLI
        uses: ./.interns/.github/actions/install-claude-cli

      - name: Prepare agent git (identity, no checkout credential)
        uses: ./.interns/.github/actions/prepare-agent-git
        with:
          name: interns-coder
          email: interns-coder@users.noreply.github.com

      # push_branch (MCP) and the draft-PR step push with the coder token via gh's credential helper.
      - name: Authenticate git pushes with the coder token
        env:
          GH_TOKEN: ${{ steps.coder_token.outputs.token }}
        run: gh auth setup-git --hostname github.com

      # Consumer-owned `make setup`: the allowlist can't install anything, and failing here spends no Claude tokens.
      - name: Install dependencies (make setup)
        run: python3 -m interns.entrypoint run-setup "$GITHUB_WORKSPACE"

      - name: Run Claude coder (initial implementation)
        id: coder_initial
        if: needs.plan.outputs.fix_round != 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
          GH_TOKEN: ${{ steps.coder_token.outputs.token }}
          AGENT_MODEL: ${{ steps.cfg.outputs.model }}
          AGENT_MAX_TURNS: ${{ steps.cfg.outputs.max_turns }}
          AGENT_TOOLS: Read,Grep,Glob,Write,Edit,Bash${{ steps.cfg.outputs.tools_suffix }}
          AGENT_ALLOWED_TOOLS: Read,Grep,Glob,Write,Edit,${{ env.ALLOWED_FS_READ }},${{ env.ALLOWED_GIT_WRITE }},${{ env.ALLOWED_BUILD_TEST }},${{ env.ALLOWED_PUSH_BRANCH }},${{ env.ALLOWED_OPEN_PR }},${{ env.ALLOWED_COMMENT_ISSUE }}${{ steps.cfg.outputs.allowed_tools_suffix }}
          AGENT_DISALLOWED_TOOLS: ${{ steps.cfg.outputs.disallowed_tools }}
          AGENT_ADD_DIR: ${{ steps.cfg.outputs.wiki_dir }}
          AGENT_DEBUG: ${{ (inputs.debug == true || steps.cfg.outputs.debug == 'true') && 'true' || 'false' }}
          INTERNS_AGENT_PROMPT: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            COMMIT_TYPE_HINT: ${{ steps.hints.outputs.commit_type_hint }}
            BRANCH: ${{ steps.hints.outputs.branch }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the issue above.
        run: >
          python3 -m interns.entrypoint run-agent
          --model "$AGENT_MODEL"
          --max-turns "$AGENT_MAX_TURNS"
          --mcp-config /tmp/mcp-config-gh-issues.json
          --tools "$AGENT_TOOLS"
          --allowed-tools "$AGENT_ALLOWED_TOOLS"
          --disallowed-tools "$AGENT_DISALLOWED_TOOLS"
          --add-dir "$AGENT_ADD_DIR"
          --execution-file "${{ runner.temp }}/execution-coder-initial.jsonl"
          --debug-file "${{ runner.temp }}/debug-coder-initial.log"
          --debug "$AGENT_DEBUG"

      - name: Load coder fix-round instructions
        id: fix_instructions
        if: needs.plan.outputs.fix_round == 'true'
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/_shared-coder.md .interns/.github/prompts/code-fix.md

      - name: Run Claude coder (fix round)
        id: coder_fix
        if: needs.plan.outputs.fix_round == 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
          GH_TOKEN: ${{ steps.coder_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          AGENT_MODEL: ${{ steps.cfg.outputs.model }}
          AGENT_MAX_TURNS: ${{ steps.cfg.outputs.max_turns }}
          AGENT_TOOLS: Read,Grep,Glob,Write,Edit,Bash${{ steps.cfg.outputs.tools_suffix }}
          AGENT_ALLOWED_TOOLS: Read,Grep,Glob,Write,Edit,${{ env.ALLOWED_FS_READ }},${{ env.ALLOWED_GIT_WRITE }},${{ env.ALLOWED_BUILD_TEST }},${{ env.ALLOWED_PUSH_BRANCH }},${{ env.ALLOWED_COMMENT_PR }}${{ steps.cfg.outputs.allowed_tools_suffix }}
          AGENT_DISALLOWED_TOOLS: ${{ steps.cfg.outputs.disallowed_tools }}
          AGENT_ADD_DIR: ${{ steps.cfg.outputs.wiki_dir }}
          AGENT_DEBUG: ${{ (inputs.debug == true || steps.cfg.outputs.debug == 'true') && 'true' || 'false' }}
          INTERNS_AGENT_PROMPT: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            PR NUMBER: ${{ steps.pr.outputs.pr_number }}
            BRANCH: ${{ steps.pr.outputs.head_ref }} (already checked out)

            REVIEWER FEEDBACK:
            ${{ steps.feedback.outputs.text }}

            INSTRUCTIONS:
            ${{ steps.fix_instructions.outputs.text }}

            Apply the instructions above to the feedback above.
        run: >
          python3 -m interns.entrypoint run-agent
          --model "$AGENT_MODEL"
          --max-turns "$AGENT_MAX_TURNS"
          --mcp-config /tmp/mcp-config-gh-issues.json
          --tools "$AGENT_TOOLS"
          --allowed-tools "$AGENT_ALLOWED_TOOLS"
          --disallowed-tools "$AGENT_DISALLOWED_TOOLS"
          --add-dir "$AGENT_ADD_DIR"
          --execution-file "${{ runner.temp }}/execution-coder-fix.jsonl"
          --debug-file "${{ runner.temp }}/debug-coder-fix.log"
          --debug "$AGENT_DEBUG"

      - name: Resolve coder round result
        id: agent
        if: always()
        env:
          INITIAL_OUTCOME: ${{ steps.coder_initial.outcome }}
          FIX_OUTCOME: ${{ steps.coder_fix.outcome }}
          EXECUTION_FILE: ${{ steps.coder_initial.outputs.execution_file }}${{ steps.coder_fix.outputs.execution_file }}
          DEBUG_FILE: ${{ steps.coder_initial.outputs.debug_file }}${{ steps.coder_fix.outputs.debug_file }}
        run: |
          outcome=$INITIAL_OUTCOME
          if [ "$outcome" = "skipped" ]; then outcome=$FIX_OUTCOME; fi
          {
            echo "outcome=$outcome"
            echo "execution_file=$EXECUTION_FILE"
            echo "debug_file=$DEBUG_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Upload coder execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.agent.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-coder-${{ needs.plan.outputs.fix_round == 'true' && 'fix' || 'initial' }}-issue-${{ steps.issue.outputs.number }}
          path: |
            ${{ steps.agent.outputs.execution_file }}
            ${{ steps.agent.outputs.debug_file }}

      # The agent can run out of turns before committing; keep its tree as a draft PR.
      - name: Save unfinished work as draft PR
        id: draft_pr
        if: failure() && needs.plan.outputs.fix_round != 'true' && steps.agent.outputs.outcome == 'failure'
        env:
          GH_TOKEN: ${{ steps.coder_token.outputs.token }}
          ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          COMMIT_TYPE_HINT: ${{ steps.hints.outputs.commit_type_hint }}
          GIT_AUTHOR_NAME: interns-coder
          GIT_AUTHOR_EMAIL: interns-coder@users.noreply.github.com
          GIT_COMMITTER_NAME: interns-coder
          GIT_COMMITTER_EMAIL: interns-coder@users.noreply.github.com
        run: >
          python3 -m interns.entrypoint save-draft-pr
          --issue "${{ steps.issue.outputs.number }}"
          --issue-title "$ISSUE_TITLE"
          --commit-type-hint "$COMMIT_TYPE_HINT"

      # Greps the Makefile rather than trusting the agent, so the nudge fires even on a failed run.
      - name: Check test/build configuration
        id: build_config
        if: always()
        run: python3 -m interns.entrypoint check-build-config "$GITHUB_WORKSPACE"

      - name: Report run cost
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          warn_args=()
          if [[ "${{ steps.build_config.outputs.configured }}" != "true" ]]; then
            warn_args=(--warn "tests/build aren't configured for this repo — fill in the test/build targets in Makefile so the pipeline can actually verify changes.")
          fi
          python3 -m interns.entrypoint report-run \
            --phase Coder \
            --exec-file "${{ steps.agent.outputs.execution_file }}" \
            --issue "${{ steps.issue.outputs.number }}" \
            "${warn_args[@]}"

      # Exit 0 on purpose: the agent isn't failing, it's reporting it can't proceed (./.coder-gave-up.md).
      # Escalate to a human instead of wasting a reviewer round.
      - name: Check for coder give-up (fix round)
        id: giveup
        if: needs.plan.outputs.fix_round == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint handle-giveup
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.pr.outputs.pr_number }}"

      - name: Check PR now exists
        id: verify_pr
        if: success() && steps.giveup.outputs.gave_up != 'true'
        uses: ./.interns/.github/actions/find-pr-for-issue
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint extract-metrics
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --job coder
          --ref "${{ inputs.pipeline_ref }}"
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number || steps.pr.outputs.pr_number }}"
          > "${{ runner.temp }}/metrics-coder.json"

      - name: Upload run metrics
        if: always() && steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-coder
          path: ${{ runner.temp }}/metrics-coder.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Hand off to reviewer
        if: success() && steps.giveup.outputs.gave_up != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint handoff-to-review
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number }}"

      - name: Write run summary
        if: always() && steps.agent.outputs.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint run-summary
          --phase Coder
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number || steps.pr.outputs.pr_number }}"
          --round ${{ needs.plan.outputs.fix_round == 'true' && 'fix' || 'initial' }}
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_ROUND: ${{ needs.plan.outputs.fix_round }}
        run: |
          if [[ "$FIX_ROUND" == "true" ]]; then
            python3 -m interns.entrypoint flag-failure --noun implementation \
              --exec-file "${{ steps.agent.outputs.execution_file }}" \
              --issue "${{ steps.issue.outputs.number }}" \
              --pr "${{ steps.pr.outputs.pr_number }}" --fix-round
          else
            python3 -m interns.entrypoint flag-failure --noun implementation \
              --exec-file "${{ steps.agent.outputs.execution_file }}" \
              --issue "${{ steps.issue.outputs.number }}" \
              --draft-pr-url "${{ steps.draft_pr.outputs.draft_pr_url }}"
          fi

  reviewer:
    needs: plan
    if: needs.plan.outputs.job == 'reviewer'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN-authored label edits don't trigger runs, so Apply verdict dispatches the coder explicitly (actions: write).
    # Job-level permissions replace the top-level ones: list every permission this job needs.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
    concurrency:
      group: reviewer-pr-${{ needs.plan.outputs.pr }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      # pull_request checks out the merge-preview ref and a dispatch re-run the default branch; neither is the
      # PR head (the coder's fix-round checkout fixes it the same way).
      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ needs.plan.outputs.pr }}"
          HEAD_REF=$(python3 -m interns.entrypoint gh-query --query head-ref --number "$PR")
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Resolve linked issue
        id: linked
        uses: ./.interns/.github/actions/resolve-linked-issue
        with:
          pr_number: ${{ needs.plan.outputs.pr }}

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: reviewer

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: ./.interns/.github/actions/checkout-wiki
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          destination: ${{ steps.cfg.outputs.wiki_dir }}

      - name: Generate reviewer app token
        id: reviewer_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_REVIEWER_APP_PRIVATE_KEY }}

      - name: Load reviewer instructions
        id: instructions
        run: python3 -m interns.entrypoint prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/review.md

      - name: Set up gh-issues MCP server
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.reviewer_token.outputs.token }}
          tools: view_issue,view_pr,view_pr_diff,pr_checks,view_job_log,submit_pr_review,comment_pr

      - name: Install Claude CLI
        uses: ./.interns/.github/actions/install-claude-cli

      - name: Run Claude reviewer
        id: agent
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        env:
          PR_NUMBER: ${{ needs.plan.outputs.pr }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
          GH_TOKEN: ${{ steps.reviewer_token.outputs.token }}
          AGENT_MODEL: ${{ steps.cfg.outputs.model }}
          AGENT_MAX_TURNS: ${{ steps.cfg.outputs.max_turns }}
          AGENT_TOOLS: Read,Grep,Glob,Bash${{ steps.cfg.outputs.tools_suffix }}
          AGENT_ALLOWED_TOOLS: Read,Grep,Glob,${{ env.ALLOWED_GIT_READ }},${{ env.ALLOWED_VIEW_PR }},${{ env.ALLOWED_VIEW_PR_DIFF }},${{ env.ALLOWED_PR_CHECKS }},${{ env.ALLOWED_VIEW_JOB_LOG }},${{ env.ALLOWED_VIEW_ISSUE }},${{ env.ALLOWED_SUBMIT_REVIEW }},${{ env.ALLOWED_COMMENT_PR }}${{ steps.cfg.outputs.allowed_tools_suffix }}
          AGENT_DISALLOWED_TOOLS: ${{ steps.cfg.outputs.disallowed_tools }}
          AGENT_ADD_DIR: ${{ steps.cfg.outputs.wiki_dir }}
          AGENT_DEBUG: ${{ (inputs.debug == true || steps.cfg.outputs.debug == 'true') && 'true' || 'false' }}
          INTERNS_AGENT_PROMPT: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.plan.outputs.pr }}
            LINKED ISSUE: ${{ steps.linked.outputs.issue_number }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Review this PR's diff against the linked issue's Acceptance Criteria.
        run: >
          python3 -m interns.entrypoint run-agent
          --model "$AGENT_MODEL"
          --max-turns "$AGENT_MAX_TURNS"
          --mcp-config /tmp/mcp-config-gh-issues.json
          --tools "$AGENT_TOOLS"
          --allowed-tools "$AGENT_ALLOWED_TOOLS"
          --disallowed-tools "$AGENT_DISALLOWED_TOOLS"
          --add-dir "$AGENT_ADD_DIR"
          --execution-file "${{ runner.temp }}/execution-reviewer.jsonl"
          --debug-file "${{ runner.temp }}/debug-reviewer.log"
          --debug "$AGENT_DEBUG"

      - name: Upload reviewer execution log (debug)
        if: (inputs.debug == true || steps.cfg.outputs.debug == 'true') && always() && steps.agent.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-reviewer-pr-${{ needs.plan.outputs.pr }}
          path: |
            ${{ steps.agent.outputs.execution_file }}
            ${{ steps.agent.outputs.debug_file }}

      - name: Report run cost
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint report-run
          --phase Review
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --pr "${{ needs.plan.outputs.pr }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: always() && steps.agent.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint extract-metrics
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --job reviewer
          --ref "${{ inputs.pipeline_ref }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --pr "${{ needs.plan.outputs.pr }}"
          > "${{ runner.temp }}/metrics-reviewer.json"

      - name: Upload run metrics
        if: always() && steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-reviewer
          path: ${{ runner.temp }}/metrics-reviewer.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Apply reviewer verdict
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ needs.plan.outputs.reviewer_bot }}
        run: >
          python3 -m interns.entrypoint apply-verdict
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"

      - name: Write run summary
        if: always() && steps.agent.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ needs.plan.outputs.reviewer_bot }}
        run: >
          python3 -m interns.entrypoint run-summary
          --phase Review
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint flag-failure --noun review
          --exec-file "${{ steps.agent.outputs.execution_file }}"
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"

  pr_closed:
    # Nothing else reacts to a PR closing; without this the issue keeps status:in-progress forever.
    needs: plan
    if: needs.plan.outputs.job == 'pr_closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pr-closed-${{ needs.plan.outputs.pr }}
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Resolve linked issue
        id: linked
        uses: ./.interns/.github/actions/resolve-linked-issue
        with:
          pr_number: ${{ needs.plan.outputs.pr }}

      - name: Handle PR closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m interns.entrypoint handle-pr-closed
          --pr "${{ needs.plan.outputs.pr }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --merged "${{ github.event.pull_request.merged }}"

  metrics:
    needs: [plan, coder, reviewer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-append
    steps:
      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ inputs.pipeline_ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Download run metrics records
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pipeline-metrics-*
          path: metrics-records
          merge-multiple: true

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics-records/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metrics records produced by this run — nothing to append."
            exit 0
          fi
          python3 -m interns.entrypoint append-metrics "${files[@]}"
