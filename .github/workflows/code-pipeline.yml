name: Coding agents (reusable)

# Reusable core of the coder/reviewer pipeline. Triggered only via
# code-pipeline.yml, which owns the `issues` / `pull_request` /
# `workflow_dispatch` triggers and passes its dispatch inputs through.
on:
  workflow_call:
    inputs:
      pipeline_ref:
        description: Ref of abi83/interns to check out for pipeline assets (e.g. refs/tags/v0)
        required: true
        type: string
      issue_number:
        description: Issue number (coder phase, workflow_dispatch only)
        required: false
        type: string
      pr_number:
        description: PR number (reviewer phase, workflow_dispatch only)
        required: false
        type: string
      fix_round:
        description: Treat a coder dispatch as a reviewer fix round
        required: false
        type: boolean
        default: false
      phase:
        description: coder | reviewer (workflow_dispatch only)
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        description: OAuth token for anthropics/claude-code-action
        required: true
      INTERNS_REVIEWER_APP_PRIVATE_KEY:
        description: Private key for the reviewer GitHub App (paired with vars.INTERNS_REVIEWER_CLIENT_ID); reviewer job only
        required: true
      INTERNS_CODER_APP_PRIVATE_KEY:
        description: Private key for the coder GitHub App (paired with vars.INTERNS_CODER_CLIENT_ID); coder job only
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

env:
  ALLOWED_COMMENT_ISSUE: "mcp__gh-issues__comment_issue"
  ALLOWED_COMMENT_PR: "mcp__gh-issues__comment_pr"
  ALLOWED_OPEN_PR: "mcp__gh-issues__open_pr"
  ALLOWED_SUBMIT_REVIEW: "mcp__gh-issues__submit_pr_review"
  ALLOWED_PUSH_BRANCH: "mcp__gh-issues__push_branch"
  ALLOWED_VIEW_ISSUE: "mcp__gh-issues__view_issue"
  # In-sandbox git only. git push is deliberately absent — reaching the shared remote goes through mcp__gh-issues__push_branch.
  # Branch checkout is a workflow step now (Create coder branch / Checkout PR
  # branch below), not something the coder does itself, so checkout/switch
  # aren't in this list.
  ALLOWED_GIT_WRITE: "Bash(git add:*),Bash(git commit:*),Bash(git rm:*)"
  ALLOWED_GIT_READ: "Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
  # `make` targets, not a package-manager-specific command, so this stays the
  # same regardless of the consumer repo's language. See templates/config/Makefile.
  ALLOWED_BUILD_TEST: "Bash(make test:*),Bash(make build:*)"
  ALLOWED_CI_READ: "Bash(gh pr checks:*),Bash(gh run view:*)"
  # The reviewer's sanctioned diff source. `gh pr diff` returns the API diff,
  # which includes paths (e.g. .github/workflows/**) that claude-code-action
  # relocates out of the working tree, so `git diff` alone can't see them (#13).
  ALLOWED_PR_READ: "Bash(gh pr diff:*),Bash(gh pr view:*)"
  # Hard ceiling on event-triggered reviewer runs per PR, independent of the
  # coder<->reviewer fix-loop cap in pipeline.apply_verdict. Past this many reviews by
  # the reviewer bot, further pushes skip the Claude reviewer and go to a human.
  # workflow_dispatch bypasses it. Part of #16.
  MAX_AUTOMATIC_REVIEWS_PER_PR: 5

jobs:
  coder:
    if: >
      (github.event_name == 'issues' && github.event.label.name == 'status:ready') ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'coder')
    runs-on: ubuntu-latest
    concurrency:
      group: coder-issue-${{ github.event.issue.number || inputs.issue_number }}
    steps:
      # The coder pushes branches and opens PRs under its own GitHub App
      # identity (interns-coder: pull_requests/issues write, contents write), so
      # authorship, audit trail, and branch-protection rules can treat it
      # separately from the reviewer's identity and from github-actions[bot].
      # The installer's safety check requires vars.INTERNS_CODER_CLIENT_ID +
      # secrets.INTERNS_CODER_APP_PRIVATE_KEY, so this is unconditional like the
      # reviewer's equivalent.
      - name: Generate coder app token
        id: coder_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_CODER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_CODER_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Persisted so the agent's push_branch MCP tool reaches origin as the coder App.
          token: ${{ steps.coder_token.outputs.token }}

      # .interns/ (path: .interns, a subdirectory) must be checked out *after*
      # the main repo (path: ., the workspace root): actions/checkout wipes
      # the entire target directory before initializing a repo that isn't
      # already a matching checkout there, regardless of `clean` -- doing it
      # in the other order deletes .interns/ the moment the main checkout runs
      # (confirmed live on tetris: "Deleting the contents of ...", then Gate
      # issue type failed with the action missing). `if: always()` below is
      # what actually fixes #90 instead: if the app-token step (or Checkout)
      # fails, both are skipped, so there's nothing for this step to conflict
      # with, and Flag failure still gets .interns/ and a real issue number.
      # No hard-fail on an empty ref here (unlike the other "Resolve pipeline
      # ref" steps, see #101) -- this step must stay unconditionally
      # successful, or the #90 fix above breaks: Flag failure needs
      # .interns/ checked out even when the ref can't be resolved.
      - name: Resolve pipeline ref
        id: pipeline_ref
        if: always()
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        if: always()
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add pipeline package to PYTHONPATH
        if: always()
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.interns/pipeline/src" >> "$GITHUB_ENV"

      - name: Resolve issue
        id: issue
        if: always()
        uses: ./.interns/.github/actions/resolve-issue
        with:
          issue_number: ${{ github.event.issue.number || inputs.issue_number }}

      # Deterministic type gate: only type:coding-task and type:bug are
      # implementable. status:ready can also land on a spike or (via a manual
      # mislabel) an epic — the coder should never attempt either. Shared with
      # the estimate job's gate. Skipped on a fix round: the issue is already
      # status:in-progress and its type hasn't changed.
      - name: Gate issue type
        id: gate
        if: inputs.fix_round != 'true'
        uses: ./.interns/.github/actions/gate-issue-type
        with:
          issue_number: ${{ steps.issue.outputs.number }}
          accepted_types: type:coding-task,type:bug
          remove_status: status:ready
          reject_comment: >-
            This issue reached `status:ready` without a `type:coding-task` or
            `type:bug` label, so the coder agent won't attempt it — only those
            two types are implementable code deliverables. If this should be
            implemented, add the correct type label and re-apply `status:ready`.

      - name: Guard against duplicate or stale trigger
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM="${{ steps.issue.outputs.number }}"
          FIX_ROUND="${{ inputs.fix_round }}"
          echo "fix_round=$FIX_ROUND" >> "$GITHUB_OUTPUT"
          if [[ "${{ steps.gate.outputs.skip }}" == "true" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LABELS=$(gh issue view "$NUM" --repo ${{ github.repository }} --json labels --jq '[.labels[].name] | join(",")')
          # A fix round is an explicit dispatch from the reviewer against an issue
          # that is *already* status:in-progress — the stale-trigger guard below
          # would wrongly skip it, so let it through.
          if [[ "$FIX_ROUND" != "true" ]] && \
             [[ "$LABELS" == *"status:in-progress"* || "$LABELS" == *"status:needs-attention"* ]]; then
            echo "Issue #$NUM is already past status:ready ($LABELS) — stale or duplicate trigger, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine fix round
        id: mode
        if: steps.guard.outputs.skip != 'true'
        run: |
          # The reviewer dispatches a fix round explicitly with
          # `-f fix_round=true`; an initial `status:ready` label event never
          # sets it. No label-derived inference — issue state no longer
          # distinguishes the two (the issue stays status:in-progress for
          # the whole run).
          if [[ "${{ steps.guard.outputs.fix_round }}" == "true" ]]; then
            echo "fix_round=true" >> "$GITHUB_OUTPUT"
          else
            echo "fix_round=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set in-progress
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # set-issue-status also clears status:needs-attention so a human
          # re-dispatch after a failed run (initial or fix round) leaves no
          # contradictory labels.
          python3 -m pipeline.labels "$GITHUB_REPOSITORY" set-issue-status "${{ steps.issue.outputs.number }}" status:in-progress

      - name: Resolve agent config
        id: cfg
        if: steps.guard.outputs.skip != 'true'
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: coder

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          path: wiki

      - name: Resolve existing PR (fix round)
        id: pr
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round == 'true'
        uses: ./.interns/.github/actions/find-pr-for-issue
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - name: Mark PR pr:coding (fix round)
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round == 'true' && steps.pr.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pipeline.labels "$GITHUB_REPOSITORY" set-pr-label "${{ steps.pr.outputs.pr_number }}" pr:coding

      - name: Gather reviewer feedback (fix round)
        id: feedback
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.gather_fix_feedback
          "${{ steps.pr.outputs.pr_number }}"
          "${{ steps.pr.outputs.head_ref }}"
          "${{ steps.issue.outputs.number }}"

      # Both the Conventional Commit prefix and the branch name are derivable
      # from the issue's type:* label and title before the agent runs — the
      # coder shouldn't spend reasoning inventing them. Initial round only; a
      # fix round reuses the existing PR branch.
      - name: Derive commit-type and branch hints
        id: hints
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: >
          python3 -m pipeline.derive_code_hints
          "${{ steps.issue.outputs.number }}"

      # Creating the branch is as mechanical as naming it -- do it here rather
      # than have the coder spend a tool call discovering it's still on the
      # checked-out default branch and switching itself.
      - name: Create coder branch
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round != 'true'
        run: git checkout -b "${{ steps.hints.outputs.branch }}"

      - name: Load coder instructions
        id: instructions
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round != 'true'
        run: python3 -m pipeline.prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/_shared-coder.md .interns/.github/prompts/code.md

      - name: Set up gh-issues MCP server
        if: steps.guard.outputs.skip != 'true'
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.coder_token.outputs.token }}

      - name: Run Claude coder (initial implementation)
        id: claude_initial
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round != 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.coder_token.outputs.token }}
          show_full_output: ${{ inputs.debug }}
          allowed_bots: "claude[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            OWNER: @${{ github.repository_owner }}
            COMMIT_TYPE_HINT: ${{ steps.hints.outputs.commit_type_hint }}
            BRANCH: ${{ steps.hints.outputs.branch }}
            BODY:
            ${{ steps.issue.outputs.body }}

            ${{ steps.issue.outputs.comments }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Apply the instructions above to the issue above.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --allowedTools "Read,Grep,Glob,Write,Edit,${{ env.ALLOWED_GIT_WRITE }},${{ env.ALLOWED_BUILD_TEST }},${{ env.ALLOWED_PUSH_BRANCH }},${{ env.ALLOWED_OPEN_PR }},${{ env.ALLOWED_COMMENT_ISSUE }}"
            --disallowedTools "${{ steps.cfg.outputs.disallowed_tools }}"

      - name: Upload coder-initial execution log (debug)
        if: steps.guard.outputs.skip != 'true' && inputs.debug == 'true' && always() && steps.claude_initial.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-coder-initial-issue-${{ steps.issue.outputs.number }}
          path: ${{ steps.claude_initial.outputs.execution_file }}

      - name: Load coder fix-round instructions
        id: fix_instructions
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round == 'true'
        run: python3 -m pipeline.prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/_shared-coder.md .interns/.github/prompts/code-fix.md

      - name: Run Claude coder (fix round)
        id: claude_fix
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round == 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.coder_token.outputs.token }}
          show_full_output: ${{ inputs.debug }}
          # The fix round is dispatched by the reviewer job via `gh workflow run`
          # with the default token, so the triggering actor is github-actions[bot],
          # not a human label event — claude-code-action refuses it unless the bot
          # is allowlisted here. The initial-implementation step doesn't need this:
          # it's triggered by a real `status:ready` label event on the issue.
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ steps.issue.outputs.number }}
            TITLE: ${{ steps.issue.outputs.title }}
            PR NUMBER: ${{ steps.pr.outputs.pr_number }}
            BRANCH: ${{ steps.pr.outputs.head_ref }} (already checked out)

            REVIEWER FEEDBACK:
            ${{ steps.feedback.outputs.text }}

            INSTRUCTIONS:
            ${{ steps.fix_instructions.outputs.text }}

            Apply the instructions above to the feedback above.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --allowedTools "Read,Grep,Glob,Write,Edit,${{ env.ALLOWED_GIT_WRITE }},${{ env.ALLOWED_BUILD_TEST }},${{ env.ALLOWED_PUSH_BRANCH }},${{ env.ALLOWED_COMMENT_PR }}"
            --disallowedTools "${{ steps.cfg.outputs.disallowed_tools }}"

      - name: Upload coder-fix execution log (debug)
        if: steps.guard.outputs.skip != 'true' && inputs.debug == 'true' && always() && steps.claude_fix.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-coder-fix-issue-${{ steps.issue.outputs.number }}
          path: ${{ steps.claude_fix.outputs.execution_file }}

      # Deterministic, independent of what the coder did or said this run --
      # greps the Makefile on disk rather than trusting the agent's word for
      # it, so the nudge below fires even on a run that failed outright.
      - name: Check test/build configuration
        id: build_config
        if: steps.guard.outputs.skip != 'true' && always()
        run: python3 -m pipeline.check_build_config "$GITHUB_WORKSPACE"

      - name: Report run cost
        if: steps.guard.outputs.skip != 'true' && always() && (steps.claude_initial.outputs.execution_file != '' || steps.claude_fix.outputs.execution_file != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          warn_args=()
          if [[ "${{ steps.build_config.outputs.configured }}" != "true" ]]; then
            warn_args=(--warn "tests/build aren't configured for this repo — fill in the test/build targets in Makefile so the pipeline can actually verify changes.")
          fi
          python3 -m pipeline.report_run Coder \
            "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}" \
            "${{ steps.issue.outputs.number }}" \
            "${warn_args[@]}"

      # A fix round that can't do the work (protected path, out-of-scope or
      # contradictory feedback, needs an owner decision) leaves a
      # ./.coder-gave-up.md sentinel instead of pushing. Escalate straight to a
      # human rather than handing the PR back to the reviewer for a wasted
      # round (#9). Exit 0 is kept — the agent isn't failing, it's reporting it
      # can't proceed — so this is distinct from `Flag failure`.
      - name: Check for coder give-up (fix round)
        id: giveup
        if: steps.guard.outputs.skip != 'true' && steps.mode.outputs.fix_round == 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.handle_giveup
          "${{ steps.issue.outputs.number }}" "${{ steps.pr.outputs.pr_number }}"

      - name: Check PR now exists
        id: verify_pr
        if: steps.guard.outputs.skip != 'true' && success() && steps.giveup.outputs.gave_up != 'true'
        uses: ./.interns/.github/actions/find-pr-for-issue
        with:
          issue_number: ${{ steps.issue.outputs.number }}

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: steps.guard.outputs.skip != 'true' && always() && (steps.claude_initial.outputs.execution_file != '' || steps.claude_fix.outputs.execution_file != '')
        run: >
          python3 -m pipeline.extract_metrics
          "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}"
          --job coder
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number || steps.pr.outputs.pr_number }}"
          > "${{ runner.temp }}/metrics-coder.json"

      - name: Upload run metrics
        if: steps.guard.outputs.skip != 'true' && steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-coder
          path: ${{ runner.temp }}/metrics-coder.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Hand off to reviewer
        if: steps.guard.outputs.skip != 'true' && success() && steps.giveup.outputs.gave_up != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.handoff_to_review
          "${{ steps.issue.outputs.number }}" "${{ steps.verify_pr.outputs.pr_number }}"

      - name: Write run summary
        if: steps.guard.outputs.skip != 'true' && always() && (steps.claude_initial.outcome != 'skipped' || steps.claude_fix.outcome != 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.run_summary Coder
          "${{ steps.claude_initial.outputs.execution_file }}${{ steps.claude_fix.outputs.execution_file }}"
          --issue "${{ steps.issue.outputs.number }}"
          --pr "${{ steps.verify_pr.outputs.pr_number || steps.pr.outputs.pr_number }}"
          --round ${{ steps.mode.outputs.fix_round == 'true' && 'fix' || 'initial' }}
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        if: steps.guard.outputs.skip != 'true' && failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ steps.mode.outputs.fix_round }}" == "true" ]]; then
            python3 -m pipeline.flag_failure --noun implementation \
              --issue "${{ steps.issue.outputs.number }}" \
              --pr "${{ steps.pr.outputs.pr_number }}" --fix-round
          else
            python3 -m pipeline.flag_failure --noun implementation \
              --issue "${{ steps.issue.outputs.number }}"
          fi

  reviewer:
    # Skip PRs the reviewer can't meaningfully handle instead of failing on them
    # (see #132 defect 8):
    #  - fork PRs have no access to secrets, so CLAUDE_CODE_OAUTH_TOKEN /
    #    INTERNS_REVIEWER_APP_PRIVATE_KEY are empty and the run just errors out;
    #  - bot PRs other than the coder's own App (Dependabot, etc.) aren't in
    #    allowed_bots and produce an "Automated review failed" comment. The
    #    coder's bot login is per-account (interns-coder-<owner>[bot]), not a
    #    fixed name, so it can't be compared here at job-if time (no steps.*
    #    yet) -- "Dedup check" below folds this into its existing skip output
    #    once the coder's identity is resolved as a step.
    # A skipped job posts nothing. workflow_dispatch stays an unconditional
    # manual override.
    if: >
      (github.event_name == 'pull_request' &&
        github.event.action != 'closed' &&
        github.event.pull_request.head.repo.fork == false) ||
      (github.event_name == 'workflow_dispatch' && inputs.phase == 'reviewer')
    runs-on: ubuntu-latest
    # GITHUB_TOKEN-authored label edits don't fire new workflow runs (GitHub's
    # anti-recursion rule for the default token), so a label alone would never
    # re-trigger the coder job for a fix round. actions: write lets this job
    # explicitly dispatch it instead (see "Apply verdict" below) — an
    # intentional workflow_dispatch call, which is exempt from that restriction.
    # Overriding permissions at job level means every permission this job needs
    # must be listed here, not just the new one.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write
      id-token: write
    concurrency:
      group: reviewer-pr-${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A `pull_request` event checks out GitHub's synthetic merge-preview
      # ref by default, and a `workflow_dispatch` re-run (no --ref) leaves us
      # on the default branch instead — neither is the PR's actual head. The
      # coder job hits the same gap for its fix round (see "Checkout PR
      # branch (fix round)" above) and fixes it the same way.
      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          HEAD_REF=$(gh pr view "$PR" --repo ${{ github.repository }} --json headRefName --jq .headRefName)
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Resolve pipeline ref
        id: pipeline_ref
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add pipeline package to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.interns/pipeline/src" >> "$GITHUB_ENV"

      - name: Resolve linked issue
        id: linked
        uses: ./.interns/.github/actions/resolve-linked-issue
        with:
          pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}

      - name: Resolve agent config
        id: cfg
        uses: ./.interns/.github/actions/resolve-agent-config
        with:
          agent: reviewer

      - name: Checkout wiki
        if: steps.cfg.outputs.wiki_enabled == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ steps.cfg.outputs.wiki_repo }}
          path: wiki

      - name: Wait for PR checks
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m pipeline.wait_for_checks "${{ github.event.pull_request.number }}"

      - name: Route red checks to a human
        if: steps.checks.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.route_red_checks
          "${{ github.event.pull_request.number }}"
          "${{ steps.linked.outputs.issue_number }}"
          "${{ steps.checks.outputs.reason }}"

      # The reviewer runs under its own GitHub App identity, distinct from the
      # coder's, so it can actually submit an APPROVE review — GitHub forbids
      # approving a PR authored by the same identity (#119).
      - name: Generate reviewer app token
        id: reviewer_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_REVIEWER_APP_PRIVATE_KEY }}

      # One source of truth for the reviewer's bot login, derived from the app
      # token (which is derived from vars.INTERNS_REVIEWER_CLIENT_ID). Every step that
      # matches reviews by author reads this output — renaming the app only
      # touches the variable, never a hardcoded slug (see #132 defect 3).
      - name: Resolve reviewer identity
        id: ident
        run: echo "bot=${{ steps.reviewer_token.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"

      # Needed only to resolve the coder's bot login below (never used to
      # authenticate anything in this job) -- the PR-author check at job-if
      # time can't compare against a fixed name since the coder's login is
      # per-account (interns-coder-<owner>[bot]).
      - name: Generate coder app token
        id: coder_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.INTERNS_CODER_CLIENT_ID }}
          private-key: ${{ secrets.INTERNS_CODER_APP_PRIVATE_KEY }}

      - name: Resolve coder identity
        id: coder_ident
        run: echo "bot=${{ steps.coder_token.outputs.app-slug }}[bot]" >> "$GITHUB_OUTPUT"

      # Dedup, plus the bot-identity check that used to live at job-if (see
      # above): a bot-authored PR whose author isn't the coder's own App
      # (Dependabot, etc.) skips the same way a duplicate event does. The
      # round cap lives in "Apply verdict" -- the reviewer always runs and
      # submits a verdict (so a second review can still land on APPROVE),
      # and the escalate-vs-dispatch-coder decision is made from that
      # verdict — see #132 defect 6.
      - name: Dedup check
        id: check
        if: steps.checks.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ steps.ident.outputs.bot }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
          CODER_BOT: ${{ steps.coder_ident.outputs.bot }}
        run: |
          if [[ "$PR_AUTHOR_TYPE" == "Bot" && "$PR_AUTHOR_LOGIN" != "$CODER_BOT" ]]; then
            echo "PR author $PR_AUTHOR_LOGIN isn't the coder's own App ($CODER_BOT) — not a pipeline PR, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          HEAD_SHA=$(gh pr view "$PR" --repo ${{ github.repository }} --json headRefOid --jq .headRefOid)
          LAST_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR/reviews" \
            --jq '[.[] | select(.user.login==env.REVIEWER_BOT)] | last | .commit_id // empty')

          if [[ -n "$LAST_SHA" && "$LAST_SHA" == "$HEAD_SHA" ]]; then
            echo "Head commit $HEAD_SHA already reviewed — duplicate event, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Hard ceiling on automatic reviews per PR (#16). Event-triggered only —
      # workflow_dispatch is an explicit human override and never runs this.
      - name: Enforce automatic review cap
        id: cap
        if: github.event_name == 'pull_request' && steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ steps.ident.outputs.bot }}
        run: >
          python3 -m pipeline.check_review_cap
          "${{ github.event.pull_request.number }}"

      - name: Load reviewer instructions
        id: instructions
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true'
        run: python3 -m pipeline.prompt .interns/.github/prompts/_shared.md .interns/.github/prompts/review.md

      - name: Set up gh-issues MCP server
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true'
        uses: ./.interns/.github/actions/setup-gh-issues-mcp
        with:
          gh_token: ${{ steps.reviewer_token.outputs.token }}

      - name: Run Claude reviewer
        id: claude
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true'
        timeout-minutes: ${{ fromJSON(steps.cfg.outputs.timeout_minutes) }}
        uses: anthropics/claude-code-action@v1
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: ${{ steps.cfg.outputs.max_output_tokens }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.reviewer_token.outputs.token }}
          show_full_output: ${{ inputs.debug }}
          allowed_bots: "${{ steps.coder_ident.outputs.bot }}"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
            LINKED ISSUE: ${{ steps.linked.outputs.issue_number }}

            INSTRUCTIONS:
            ${{ steps.instructions.outputs.text }}

            Review this PR's diff against the linked issue's Acceptance Criteria.
          claude_args: |
            --model ${{ steps.cfg.outputs.model }}
            --max-turns ${{ steps.cfg.outputs.max_turns }}
            --mcp-config /tmp/mcp-config-gh-issues.json
            --allowedTools "Read,Grep,Glob,${{ env.ALLOWED_GIT_READ }},${{ env.ALLOWED_PR_READ }},${{ env.ALLOWED_CI_READ }},${{ env.ALLOWED_VIEW_ISSUE }},${{ env.ALLOWED_SUBMIT_REVIEW }},${{ env.ALLOWED_COMMENT_PR }}"
            --disallowedTools "${{ steps.cfg.outputs.disallowed_tools }}"

      - name: Upload reviewer execution log (debug)
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true' && inputs.debug == 'true' && always() && steps.claude.outputs.execution_file != ''
        uses: ./.interns/.github/actions/upload-execution-log
        with:
          name: execution-log-reviewer-pr-${{ github.event.pull_request.number || inputs.pr_number }}
          path: ${{ steps.claude.outputs.execution_file }}

      - name: Report run cost
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true' && always() && steps.claude.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.report_run Review
          "${{ steps.claude.outputs.execution_file }}"
          "${{ steps.linked.outputs.issue_number }}"
          "${{ github.event.pull_request.number || inputs.pr_number }}"

      - name: Extract run metrics
        id: metrics
        continue-on-error: true
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true' && always() && steps.claude.outputs.execution_file != ''
        run: >
          python3 -m pipeline.extract_metrics
          "${{ steps.claude.outputs.execution_file }}"
          --job reviewer
          --issue "${{ steps.linked.outputs.issue_number }}"
          --pr "${{ github.event.pull_request.number || inputs.pr_number }}"
          > "${{ runner.temp }}/metrics-reviewer.json"

      - name: Upload run metrics
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true' && steps.metrics.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-metrics-reviewer
          path: ${{ runner.temp }}/metrics-reviewer.json
          if-no-files-found: ignore
          retention-days: 2

      - name: Apply reviewer verdict
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true' && success()
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ steps.ident.outputs.bot }}
        run: >
          python3 -m pipeline.apply_verdict
          "${{ github.event.pull_request.number || inputs.pr_number }}"
          "${{ steps.linked.outputs.issue_number }}"

      - name: Write run summary
        if: steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true' && steps.cap.outputs.capped != 'true' && always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER_BOT: ${{ steps.ident.outputs.bot }}
        run: >
          python3 -m pipeline.run_summary Review
          "${{ steps.claude.outputs.execution_file }}"
          --pr "${{ github.event.pull_request.number || inputs.pr_number }}"
          --issue "${{ steps.linked.outputs.issue_number }}"
          --cost-warn "${{ steps.cfg.outputs.cost_warn_usd }}"

      - name: Flag failure
        # Also fires when Resolve agent config fails — that step runs before
        # `checks`, so a bad config would otherwise leave checks.outputs.ok
        # empty and skip the standard failure comment (#150's generic fallback).
        if: >
          failure() && (
            steps.cfg.outcome == 'failure' ||
            (steps.checks.outputs.ok == 'true' && steps.check.outputs.skip != 'true')
          )
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.flag_failure --noun review
          --pr "${{ github.event.pull_request.number || inputs.pr_number }}"
          --issue "${{ steps.linked.outputs.issue_number }}"

  pr_closed:
    # Nothing else in the pipeline reacts to a PR closing, so the linked issue
    # would keep status:in-progress forever (#37). On merge, drop the label from
    # the already-closed issue; on an unmerged close, move it to
    # status:needs-attention with a comment. Clears any stale pr:* label either
    # way. No agent, no secrets — just label bookkeeping.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    concurrency:
      group: pr-closed-${{ github.event.pull_request.number }}
    steps:
      - name: Resolve pipeline ref
        id: pipeline_ref
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add pipeline package to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.interns/pipeline/src" >> "$GITHUB_ENV"

      - name: Resolve linked issue
        id: linked
        uses: ./.interns/.github/actions/resolve-linked-issue
        with:
          pr_number: ${{ github.event.pull_request.number }}

      - name: Handle PR closed
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python3 -m pipeline.handle_pr_closed
          "${{ github.event.pull_request.number }}"
          "${{ steps.linked.outputs.issue_number }}"
          "${{ github.event.pull_request.merged }}"

  metrics:
    # One commit per workflow run: append the records the agent jobs uploaded to
    # the metrics branch. The concurrency group serialises appends across runs.
    needs: [coder, reviewer]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: metrics-append
    steps:
      - name: Resolve pipeline ref
        id: pipeline_ref
        run: echo "ref=${{ inputs.pipeline_ref }}" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline assets
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.pipeline_ref.outputs.ref }}
          path: .interns

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add pipeline package to PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE/.interns/pipeline/src" >> "$GITHUB_ENV"

      - name: Download run metrics records
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: pipeline-metrics-*
          path: metrics-records
          merge-multiple: true

      - name: Append to the metrics branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(metrics-records/*.json)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No metrics records produced by this run — nothing to append."
            exit 0
          fi
          python3 -m pipeline.append_metrics "${files[@]}"
