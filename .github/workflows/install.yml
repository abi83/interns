name: Install interns

# github.token can't write .github/workflows/*, so interns-install stages the caller stubs itself.
# Branch protection and Pages need admin access github.token never has; interns-install checks them locally.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "interns ref for the manifest (default: this run's ref)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: >
          interns ref to copy the label manifest from. Defaults to the exact
          ref the caller pinned this workflow to, so the manifest always
          matches the installer version. Override with a concrete tag if needed.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the interns ref
        id: ref
        # Precedence: explicit input > the ref the caller pinned (job_workflow_ref) > this run's ref.
        # Never github.sha: in a workflow_call it is the consumer's commit.
        env:
          INPUT_REF: ${{ inputs.ref }}
          JOB_WORKFLOW_REF: ${{ github.job_workflow_ref }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "$INPUT_REF" ]]; then
            ref="$INPUT_REF"
          elif [[ -n "$JOB_WORKFLOW_REF" ]]; then
            # job_workflow_ref ends in @<ref>, either bare or fully qualified (refs/tags/...).
            ref="${JOB_WORKFLOW_REF##*@}"
          else
            ref="$RUN_REF"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using interns ref: $ref"

      - name: Check out interns (manifest + scripts)
        # Needs read access to this repo; a cross-org consumer must pass a PAT or App token.
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.ref.outputs.ref }}
          path: .interns

      - name: Set up pipeline Python
        uses: ./.interns/.github/actions/setup-pipeline-python

      - name: Sync the label manifest
        run: python3 -m interns.entrypoint sync-labels .interns/.github/labels.json
