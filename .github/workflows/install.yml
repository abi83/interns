name: Install interns

# Provisions a consumer repo for the interns pipeline:
#   1. syncs the versioned label manifest (unconditional)
#   2. checks that the App/OAuth secrets and variables interns-install wrote
#      are present (best-effort -- github.token can't list them either)
#
# The caller stubs (issue-pipeline.yml, code-pipeline.yml, interns.yml) and the
# issue templates are staged by interns-install itself: github.token cannot
# create or update .github/workflows/*, so this workflow can never open that PR.
#
# Branch protection and Pages are NOT checked here -- both need admin access
# to read or write, which github.token can never be granted. interns-install
# checks and fixes them locally, with the operator's own admin-scoped `gh`
# session, before it ever dispatches this workflow.
#
# Callable two ways:
#   - workflow_call, pinned to a tag, from a consumer repo's own wrapper
#   - workflow_dispatch, from this repo, to (re-)sync abi83/interns' own labels
#
# Idempotent: re-running just re-syncs label drift.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "interns ref for the manifest (default: this run's ref)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: >
          interns ref to copy the label manifest from. Defaults to the exact
          ref the caller pinned this workflow to, so the manifest always
          matches the installer version. Override with a concrete tag if needed.
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve the interns ref
        id: ref
        # Precedence: explicit input > the ref the caller pinned this reusable
        # workflow to (github.job_workflow_ref, ".../install.yml@refs/tags/vX")
        # > this run's own sha (the workflow_dispatch-on-this-repo case).
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.ref }}" ]]; then
            ref="${{ inputs.ref }}"
          elif [[ -n "${{ github.job_workflow_ref }}" ]]; then
            ref="${{ github.job_workflow_ref }}"
            ref="refs/${ref##*@refs/}"
          else
            ref="${{ github.sha }}"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using interns ref: $ref"

      - name: Check out interns (manifest + scripts)
        # github.token must be able to read abi83/interns — true for a
        # workflow_dispatch run in this repo, and for consumers in the same
        # org with Actions repo-access configured. A cross-org consumer
        # passes a PAT or App token here instead.
        uses: actions/checkout@v5
        with:
          repository: abi83/interns
          ref: ${{ steps.ref.outputs.ref }}
          path: .interns

      - name: Sync the label manifest
        run: .interns/.github/scripts/install/sync-labels.sh .interns/.github/labels.json

      # Branch protection and Pages are checked by interns-install itself,
      # locally, before this workflow ever runs -- both need admin access,
      # which github.token can't be granted. This is just a best-effort
      # presence check for the secrets/variables interns-install writes.
      - name: Verify required secrets and variables
        run: .interns/.github/scripts/install/safety-checks.sh
