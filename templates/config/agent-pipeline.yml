# interns pipeline config — per-agent execution limits.
# Precedence: this file > org/repo Actions vars > the interns defaults.
# Schema: abi83/interns/.github/agent-pipeline.schema.json
# Everything here is optional; delete a key to fall back to the default.

# Safety: keep the agents off the default branch. Set true only if the repo's
# branch protection already blocks the bot identities some other way — the
# installer's safety check then skips creating the baseline protection.
# allow_agent_push_to_default_branch: false

defaults:
  max_turns: 40
  timeout_minutes: 20
  cost_warn_usd: 2.0

agents:
  # The refiner defaults to claude-sonnet-5 (it investigates the codebase
  # before rewriting) — set `model:` here to override per phase.
  refiner:
    max_turns: 25
  estimator:
    max_turns: 20
  coder:
    timeout_minutes: 30
  reviewer:
    max_turns: 30
