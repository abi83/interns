# interns' built-in defaults -- the single source of truth for every
# configurable key. Loaded by interns.config; interns-install renders a
# consumer's starter .github/interns.yml from it with every key commented out.
# Precedence: agents.<name>.<key> > defaults.<key> > these defaults.
# Schema: abi83/interns/.github/interns.schema.json

# Branch GitHub Pages is served from. Defaults to the repo's default branch.
# Set this only when your Pages source is a different branch (e.g. gh-pages).
# pages_branch: gh-pages

# Set to true to show full Claude conversation in logs and attach execution
# logs as artifacts on every automatically triggered run.
debug: false

# Wiki checked out for the agents to read, next to the repo checkout
# (../<name>.wiki). Disabled by default.
wiki:
  enabled: false
  # url: owner/repo.wiki

# The reviewer needs every PR check to be green before it runs. List any
# non-blocking advisory checks here (preview deploys, coverage deltas) to keep
# them out of that gate.
checks:
  ignore: []
  #  - preview-deploy
  # How long (in seconds) a review waits for stragglers when a check suite
  # completes. Checks still running after that skip the review; the next suite
  # to complete triggers it again.
  timeout_seconds: 120
  poll_seconds: 20
  settle_seconds: 30

# Coder–reviewer loop limits. Two independent caps on the same loop:
# max_fix_rounds bounds automatic fix rounds per CHANGES_REQUESTED verdict;
# max_automatic_reviews bounds total reviewer runs per PR regardless of outcome.
review_loop:
  max_fix_rounds: 1
  max_automatic_reviews: 5

defaults:
  model: claude-sonnet-5-5
  max_turns: 60
  timeout_minutes: 20
  max_output_tokens: 32000
  cost_warn_usd: 2.0
  # Tools on top of interns' own, for every agent (Claude Code permission
  # patterns). Keep them narrow: "Bash(npm run *)" runs any package script.
  # allowed_tools:
  #   - "Bash(npm run lint:*)"
  # Removed from every agent, interns' own tools included; beats allowed_tools.
  # disallowed_tools:
  #   - "WebFetch"

agents:
  # The refiner investigates the codebase before rewriting, so it gets fewer
  # turns for the same budget.
  refiner:
    max_turns: 35
  estimator:
    max_turns: 30
  # The coder does the most work per run, so it gets a longer timeout and turn budget.
  coder:
    max_turns: 75
    timeout_minutes: 30
    # Per-agent lists add to the defaults above.
    # allowed_tools:
    #   - "Bash(npx prisma generate:*)"
    # disallowed_tools:
    #   - "Bash(psql:*)"
  reviewer:
    max_turns: 45
    # Which PR events start a review (a manual workflow_dispatch always runs).
    # Fork PRs and other bots' PRs are never reviewed.
    trigger:
      coder_prs: true         # PRs opened by the coder agent
      human_prs: true         # PRs opened by a human
      rereview_on_push: true  # every push, not just open / ready for review

# After estimation, an issue whose size is true here goes straight to the coder
# (status:ready) without waiting for a human to approve it. A size set to false
# stops at status:estimated for the owner, as before.
auto_proceed:
  XS: true
  S: true
  M: true
  L: false
  XL: false
