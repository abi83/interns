# Thin caller for the interns install workflow.
# interns-install opens the PR that adds this file (alongside the caller stubs).
# The push trigger below fires it as soon as that PR merges, so label sync
# happens without a manual re-run. Re-run any time from the Actions tab to
# re-sync label drift.
name: Install interns

on:
  push:
    paths:
      - '.github/workflows/install.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: "interns ref for the label manifest (blank = the pinned tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  install:
    uses: abi83/interns/.github/workflows/install.yml@__INTERNS_REF__
    secrets: inherit
    with:
      # Fall back to the exact tag this wrapper is pinned to, never to the
      # consumer's commit SHA.
      ref: ${{ inputs.ref || '__INTERNS_REF__' }}
