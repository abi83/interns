# Thin caller for the interns install workflow. The push trigger syncs labels once the interns-install
# PR merges; re-run from the Actions tab to re-sync drift.
name: Install interns

on:
  push:
    paths:
      - '.github/workflows/install.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: "interns ref for the label manifest (blank = the pinned tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  install:
    uses: abi83/interns/.github/workflows/install.yml@__INTERNS_REF__
    secrets: inherit
    with:
      # Fall back to the exact tag this wrapper is pinned to, never to the
      # consumer's commit SHA.
      ref: ${{ inputs.ref || '__INTERNS_REF__' }}
