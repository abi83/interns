# Thin caller for the interns issue refine/estimate pipeline.
# Owns the triggers; delegates all logic to the reusable core, pinned to a tag.
name: Refine & estimate

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string
      phase:
        description: refine | estimate
        required: true
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false

# A workflow_call can't grant more than this caller holds: cover the top-level needs and every nested job's.
permissions:
  contents: write
  issues: write

jobs:
  interns:
    uses: abi83/interns/.github/workflows/issue-pipeline.yml@__INTERNS_REF__
    secrets: inherit
    with:
      pipeline_ref: __INTERNS_REF__
      debug: ${{ inputs.debug || false }}
