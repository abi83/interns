# Thin caller for the interns issue refine/estimate pipeline.
# Owns the triggers; delegates all logic to the reusable core, pinned to a tag.
name: Issue pipeline

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: string
      phase:
        description: refine | estimate
        required: true
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false

# A workflow_call can never grant the reusable workflow more than this caller
# itself holds -- must cover its top-level needs plus every nested job's
# (the metrics-append job wants contents: write).
permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  pipeline:
    uses: abi83/interns/.github/workflows/issue-pipeline.yml@__INTERNS_REF__
    secrets: inherit
    with:
      pipeline_ref: __INTERNS_REF__
      issue_number: ${{ inputs.issue_number }}
      phase: ${{ inputs.phase }}
      debug: ${{ inputs.debug || false }}
