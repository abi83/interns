# Thin caller for the interns coder/reviewer pipeline.
# Owns the triggers; delegates all logic to the reusable core, pinned to a tag.
name: Code & review

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, synchronize, closed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number (coder phase)
        required: false
        type: string
      pr_number:
        description: PR number (reviewer phase)
        required: false
        type: string
      fix_round:
        description: Treat a coder dispatch as a reviewer fix round
        required: false
        type: boolean
        default: false
      phase:
        description: coder | reviewer
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false

# A workflow_call can never grant the reusable workflow more than this caller
# itself holds -- must cover its top-level needs plus every nested job's
# (actions: write is for a nested job, not the top-level permissions block).
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  pipeline:
    uses: abi83/interns/.github/workflows/code-pipeline.yml@__INTERNS_REF__
    secrets: inherit
    with:
      pipeline_ref: __INTERNS_REF__
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      fix_round: ${{ inputs.fix_round || false }}
      phase: ${{ inputs.phase }}
      debug: ${{ inputs.debug || false }}
