# Thin caller for the interns coder/reviewer pipeline.
# Owns the triggers; delegates all logic to the reusable core, pinned to a tag.
name: Code & review

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, ready_for_review, closed]
  workflow_run:
    workflows: ['*']
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number (coder phase)
        required: false
        type: string
      pr_number:
        description: PR number (reviewer phase)
        required: false
        type: string
      fix_round:
        description: Treat a coder dispatch as a reviewer fix round
        required: false
        type: boolean
        default: false
      phase:
        description: coder | reviewer
        required: false
        type: string
      debug:
        description: Show full Claude output in logs
        required: false
        type: boolean
        default: false

# A workflow_call can't grant more than this caller holds: cover every nested job's needs too
# (actions: write is for a nested job, not the top-level block).
permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# Open/ready/workflow-run events for one PR run one at a time, so a duplicate finds the head already reviewed.
concurrency:
  group: ${{ ((github.event.workflow_run.workflow_id != github.event.workflow.id && github.event.workflow_run.pull_requests[0].number) || (github.event.action != 'closed' && github.event.pull_request.number)) && format('review-pr-{0}', (github.event.workflow_run.workflow_id != github.event.workflow.id && github.event.workflow_run.pull_requests[0].number) || github.event.pull_request.number) || github.run_id }}

jobs:
  interns:
    uses: abi83/interns/.github/workflows/code-pipeline.yml@__INTERNS_REF__
    secrets: inherit
    with:
      pipeline_ref: __INTERNS_REF__
      debug: ${{ inputs.debug || false }}
